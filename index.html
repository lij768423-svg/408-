}

// ============== 备份 / 恢复 ==============
function getBackupPayload() {
  return {
    app: "408-quiz",
    version: 1,
    exportedAt: new Date().toISOString(),
    state: STATE,
    session: getSessionSnapshot(),
    preferences: {
      imageVisible: imgVisible,
      panelOpen,
      instantGrade: CURRENT.instantGrade,
      limit: CURRENT.limit
    }
  };
}

function exportProgress() {
  const payload = getBackupPayload();
  const date = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `408-quiz-progress-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("学习记录已导出");
}

function importProgressFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(String(reader.result || ""));
      if (payload.app !== "408-quiz" || !payload.state) {
        toast("这不是 408 刷题记录文件");
        return;
      }
      if (!confirm("导入后会覆盖当前错题、收藏、统计和本轮进度。确定继续吗?")) return;
      STATE = {
        wrong: payload.state.wrong || {},
        favorite: payload.state.favorite || {},
        stats: payload.state.stats || { answered: 0, correct: 0 },
        attempted: payload.state.attempted || {}
      };
      saveState(STATE);
      if (payload.session) localStorage.setItem(SESSION_KEY, JSON.stringify(payload.session));
      if (payload.preferences) {
        imgVisible = payload.preferences.imageVisible !== false;
        panelOpen = payload.preferences.panelOpen !== false;
        localStorage.setItem(IMG_VIS_KEY, imgVisible ? "1" : "0");
        localStorage.setItem(PANEL_KEY, panelOpen ? "1" : "0");
        if (Number.isFinite(payload.preferences.limit)) {
          localStorage.setItem("408-quiz-limit", String(payload.preferences.limit));
        }
        localStorage.setItem("408-quiz-instant", JSON.stringify(!!payload.preferences.instantGrade));
      }
      toast("学习记录已导入");
      setTimeout(() => location.reload(), 450);
    } catch (e) {
      toast("导入失败: JSON 格式不正确");
    }
  };
  reader.readAsText(file);
}

function bindBackupControls() {
  const exportBtn = document.getElementById("export-progress");
  const importBtn = document.getElementById("import-progress");
  const importFile = document.getElementById("import-file");
  if (exportBtn) exportBtn.onclick = exportProgress;
  if (importBtn && importFile) importBtn.onclick = () => importFile.click();
  if (importFile) {
    importFile.onchange = () => {
      importProgressFile(importFile.files && importFile.files[0]);
      importFile.value = "";
    };
  }
}

// ============== 工具 ==============
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return Array.from(document.querySelectorAll(sel)); }
function escHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// 轻量语法着色:不追求完整 parser,够 408 题面看(JS/C/Python/Go/Java/类 C 系)
// 顺序很关键: 先抽字符串/注释(吞掉里头的关键字), 再做关键字/数字/函数名 —
// 所有替换都先打占位符 \x01X...\x02,等 escape 之后再统一换回 <span>。
// 这样后续 regex 不会把"刚加的 <span class=...>" 里的 class 等当 keyword 误命中。
function highlightCode(code, lang) {
  if (!code) return "";
  let s = code.replace(/\r\n?/g, "\n");
  // 1) 行注释 // ...
  s = s.replace(/(^|[^:\\])\/\/[^\n]*/g, (m, p) => p + "\x01C" + m.slice(p.length + 2) + "\x02");
  // 2) 块注释 /* ... */
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => "\x01C" + m.slice(2, -2) + "\x02");
  // 3) 字符串(双/单/反引号)
  s = s.replace(/`(?:\\.|[^`\\])*`/g, m => "\x01S" + m + "\x02");
  s = s.replace(/"(?:\\.|[^"\\])*"/g, m => "\x01S" + m + "\x02");
  s = s.replace(/'(?:\\.|[^'\\])*'/g, m => "\x01S" + m + "\x02");
  // 4) Python 注释 # ...
  if (/^(py|python)$/i.test(lang || "")) {
    s = s.replace(/(^|[^\\])#[^\n]*/g, (m, p) => p + "\x01C" + m.slice(p.length + 1) + "\x02");
  }
  // 5) 数字 / 布尔 / 关键字 / 函数名 — 全部先打占位符,避免后插 <span> 里的 class 被关键字再中招
  s = s.replace(/\b(\d[\d_]*(?:\.[\d_]+)?|0x[0-9a-fA-F]+)\b/g, "\x01N$1\x02");
  s = s.replace(/\b(true|false|null|nil|None|True|False)\b/g, "\x01B$1\x02");
  const kws = "auto|break|case|catch|class|const|continue|default|delete|do|else|enum|export|extern|finally|"
    + "for|from|function|goto|if|import|in|inline|instanceof|interface|let|namespace|new|operator|package|"
    + "private|protected|public|register|return|sizeof|static|struct|switch|template|this|throw|try|typedef|"
    + "typeof|union|using|virtual|void|volatile|while|async|await|yield|var|with|extend|fn|impl|match|"
    + "as|def|elif|except|global|lambda|nonlocal|pass|raise";
  s = s.replace(new RegExp("\\b(" + kws + ")\\b", "g"), "\x01K$1\x02");
  // 9) 函数调用 名( — 排除关键字
  s = s.replace(/\b([A-Z][A-Za-z0-9_]*)\s*\(/g, "\x01T$1\x02(");
  s = s.replace(/\b([a-z_][A-Za-z0-9_]*)\s*(?=\()/g, m => {
    const name = m.replace(/\s*\($/, "");
    if (new RegExp("\\b(" + kws + ")\\b").test(name)) return m;
    return "\x01F" + name + "\x02";
  });
  // 6) escape 剩余代码(占位符 \x01X 不含 <>&,不会被破坏)
  s = escHtml(s);
  // 7) 统一换回 <span> 标签
  s = s.replace(/\x01C([\s\S]*?)\x02/g, '<span class="tok-com">$1</span>');
  s = s.replace(/\x01S([\s\S]*?)\x02/g, '<span class="tok-str">$1</span>');
  s = s.replace(/\x01N([\s\S]*?)\x02/g, '<span class="tok-num">$1</span>');
  s = s.replace(/\x01B([\s\S]*?)\x02/g, '<span class="tok-bool">$1</span>');
  s = s.replace(/\x01K([\s\S]*?)\x02/g, '<span class="tok-kw">$1</span>');
  s = s.replace(/\x01T([\s\S]*?)\x02/g, '<span class="tok-type">$1</span>');
  s = s.replace(/\x01F([\s\S]*?)\x02/g, '<span class="tok-fn">$1</span>');
  return s;
}

// 智能 C 风格格式化: 只修正数据里被压成一行的代码块。
// 目标是“题面材料可读”,不是把代码重排成另一种风格:
//   - 函数签名 / if / else 与开大括号保持 K&R 同行
//   - 顶层分号后换行,但不拆 for(i=0;i<n;i++) 的分号
//   - 保留 if (...) return ...; else return ...; 这类短句结构
// 占位符机制先抽字符串,避免字符串内的 = ; , {} 等被误改。
function formatCode(code, lang) {
  if (!code || code.indexOf("\n") >= 0) return code;  // 已多行不处理

  let s = code
    .replace(/"(?:\\.|[^"\\])*"/g, m => "\x01S" + m + "\x02")
    .replace(/'(?:\\.|[^'\\])*'/g, m => "\x01S" + m + "\x02")
    .replace(/`(?:\\.|[^`\\])*`/g, m => "\x01S" + m + "\x02");

  s = s
    .replace(/\b(if|for|while|switch)\s*\(/g, "$1 (")
    .replace(/\belse\s*\{/g, "else {")
    .replace(/\s*(<=|>=|==|!=|&&|\|\|)\s*/g, " $1 ")
    .replace(/([A-Za-z0-9_\]\)])\s*([<>])\s*([A-Za-z0-9_\[\(])/g, "$1 $2 $3")
    .replace(/([A-Za-z0-9_\]\)])\s*([+\-*/%])\s*([A-Za-z0-9_\[\(])/g, "$1 $2 $3")
    .replace(/([A-Za-z0-9_\]\)])\s*=\s*([A-Za-z0-9_\[\(])/g, "$1 = $2")
    .replace(/;\s*/g, "; ")
    .replace(/,\s*/g, ", ")
    .replace(/\s+/g, " ")
    .replace(/\)\s+(?=(?:for|if|while)\s*\()/g, ")\n")
    .trim();

  // 拆成语义行。只在括号深度为 0 时把分号视作语句结束。
  let out = "";
  let parenDepth = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === "(" || c === "[") parenDepth++;
    else if (c === ")" || c === "]") parenDepth = Math.max(0, parenDepth - 1);

    if (c === "{") {
      out = out.replace(/[ \t]+$/g, "");
      out += " {\n";
      while (s[i + 1] === " ") i++;
      continue;
    }

    if (c === "}") {
      out = out.replace(/[ \t]+$/g, "");
      if (out && !out.endsWith("\n")) out += "\n";
      out += "}";
      while (s[i + 1] === " ") i++;

      const rest = s.slice(i + 1);
      const elseMatch = /^else\b/.exec(rest);
      if (elseMatch) {
        out += " else";
        i += elseMatch[0].length;
        while (s[i + 1] === " ") i++;
        if (s[i + 1] === "{") {
          out += " {\n";
          i++;
          while (s[i + 1] === " ") i++;
        } else {
          out += " ";
        }
      } else {
        out += "\n";
      }
      continue;
    }

    if (c === ";" && parenDepth === 0) {
      out += ";\n";
      while (s[i + 1] === " ") i++;
      continue;
    }

    out += c;
  }

  out = out.replace(/\x01S([\s\S]*?)\x02/g, '$1');

  const lines = out.split("\n");
  let braceDepth = 0;
  const formatted = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;

    const lineDepth = t.startsWith("}") ? Math.max(0, braceDepth - 1) : braceDepth;
    formatted.push("  ".repeat(lineDepth) + t);

    const opens = (t.match(/\{/g) || []).length;
    const closes = (t.match(/\}/g) || []).length;
    braceDepth = Math.max(0, braceDepth + opens - closes);
  }

  return formatted.join("\n");
}

// 轻量 Markdown 渲染: 块级结构在 escape 前检测(否则 '>' '#' 会被吃掉),
// 内容在 inlineMd 内 escape,XSS 安全。
function renderMarkdown(md) {
  if (!md) return "";
  // 0) KaTeX: 同时认四种语法 — $$...$$ / $...$ (Markdown) 和 \[...\] / \(...\) (LaTeX 原生)
  const katexOut = [];
  let s = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
    katexOut.push(katexRender(tex, true));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)(?<!\$)\$(?!\$)/g, (_, tex) => {
    katexOut.push(katexRender(tex, false));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => {
    katexOut.push(katexRender(tex, true));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/\\\((.+?)\\\)/g, (_, tex) => {
    katexOut.push(katexRender(tex, false));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  // 1) 围栏代码块先摘出占位,raw 内容稍后在 inlineMd 之外直接 escape
  const codeBlocks = [];
  s = s.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push({ lang, code });
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });
  // 单行代码块: ```lang code...```(同在一行)
  s = s.replace(/```([a-zA-Z0-9_-]*)[ \t]+([^\n`]*?)```/g, (_, lang, code) => {
    codeBlocks.push({ lang, code });
    return `\x00CB${codeBlocks.length - 1}\x00`;
  });
  // 2) 按行扫描块级结构(在原始文本上做)
  const lines = s.split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; continue; }
    // 占位行(围栏代码块)直接当块输出,避免被包进 <p>
    let ph = /^\x00CB(\d+)\x00$/.exec(line);
    if (ph) {
      const cb = codeBlocks[+ph[1]];
      const langAttr = cb.lang ? ` data-lang="${cb.lang}"` : "";
      out.push(`<pre${langAttr}><code>${highlightCode(cb.code, cb.lang)}</code></pre>`);
      i++; continue;
    }
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      const lvl = m[1].length;
      out.push(`<h${lvl}>${inlineMd(m[2])}</h${lvl}>`); i++; continue;
    }
    if (/^>\s+/.test(line)) {
      const q = [];
      while (i < lines.length && /^>\s+/.test(lines[i])) {
        q.push(lines[i].replace(/^>\s+/, "")); i++;
      }
      out.push(`<blockquote>${inlineMd(q.join(" "))}</blockquote>`);
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^[-*]\s+/, "")); i++;
      }
      out.push("<ul>" + items.map(it => `<li>${inlineMd(it)}</li>`).join("") + "</ul>");
      continue;
    }
    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\d+\.\s+/, "")); i++;
      }
      out.push("<ol>" + items.map(it => `<li>${inlineMd(it)}</li>`).join("") + "</ol>");
      continue;
    }
    if (/^-{3,}$/.test(line.trim())) { out.push("<hr>"); i++; continue; }
    // 段落: 连续非空、非块起始行合并
    const p = [];
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^(#{1,6}\s|>\s|[-*]\s|\d+\.\s)/.test(lines[i]) &&
           !/^-{3,}$/.test(lines[i].trim())) {
      p.push(lines[i]); i++;
    }
    out.push(`<p>${inlineMd(p.join(" "))}</p>`);
  }
  // 3) 占位换回 <pre><code>(code 内容单独 escape,保留缩进/换行)
  let html = out.join("");
  html = html.replace(/\x00CB(\d+)\x00/g, (_, idx) => {
    const cb = codeBlocks[+idx];
    const langAttr = cb.lang ? ` data-lang="${cb.lang}"` : "";
    const withFmt = formatCode(cb.code, cb.lang);
    return `<pre${langAttr}><code>${highlightCode(withFmt, cb.lang)}</code></pre>`;
  });
  // 4) KaTeX 占位换回(直接拼产物,已含 escape 后的安全 HTML)
  html = html.replace(/\x00KTX(\d+)\x00/g, (_, idx) => katexOut[+idx]);
  return html;

  function inlineMd(s) {
    // 先 escape 全部,再做行内变换(inline code 的内容也会被 escape,安全)
    s = escHtml(s);
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/(^|\s)_([^_\n]+)_/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
        // 链接只接受 http(s):// 和相对路径,其余返回原文
        if (/^(https?:\/\/|\/)/.test(u)) return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
        return `${t}${u ? "" : ""}`;  // 安全回退:丢掉括号和 URL,只留文本
      })
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => {
        // 兜底:含括号但 URL 头部不合法的链接,只输出可见文本
        if (!/^(https?:\/\/|\/)/.test(u)) return t;
        return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
      });
  }
}

// 把含 LaTeX($...$ / $$...$$)、Markdown 围栏代码块(```lang ... ```)、
// 图片引用(![..](images/X.jpg))、预渲染 HTML 表格(<table>)
// 和白名单内联标签的题面/解析文本转为安全 HTML。
//
// 关键: KaTeX 和代码块的高亮器内部都会对文本做 HTML escape(把 > 变 &gt;),
// 如果先 escHtml 再喂给它们,会发生双重 escape(& > &amp;gt; 浏览器解出 &gt; 字面量)。
// 修法是所有"会自己 escape 的渲染器"都先于 escHtml 跑,产物用占位符保护。
//
// 渲染顺序: 提图片占位 → 提块级占位 → 提白名单内联占位 → 提围栏代码块占位
//         → KaTeX 渲染(原文输入,产物存占位)
//         → escape 剩余内容
//         → 还占位: 块级(递归) → 内联 → 围栏代码块 → KaTeX → 图片
const BLOCK_TAGS = /<table[\s\S]*?<\/table>/gi;
const SAFE_INLINE = /<\/?(?:tr|td|th|tbody|thead|tfoot|caption|br|p|b|i|u|strong|em|sub|sup)\b[^>]*>/gi;
// 围栏代码块: 同时认多行 (```lang\ncode\n```) 和单行 (```lang code```) 两种格式
const FENCE_RE = /```([a-zA-Z0-9_+-]*)[ \t]*\n([\s\S]*?)\n[ \t]*```/g;
const FENCE_SINGLELINE = /```([a-zA-Z0-9_+-]*)[ \t]+([^\n`]*?)```/g;
// 普通文本/伪代码标签:这些"语言"不亮词法,只走 escHtml
const PLAIN_LANGS = /^(txt|text|plain|none|console|output|伪代码|无)$/i;
function formatContent(s) {
  if (s == null) return "";
  s = String(s);
  // 0. 静默剥除 <details>...</details>: 题源里的图注、mermaid 源码、
  //    text_image 辅助块都不作为题卡内容展示。
  s = s.replace(/<details\b[\s\S]*?<\/details>/gi, "");
  // 1. 图片引用 → 占位符
  const imgs = [];
  s = s.replace(/!\[[^\]]*\]\(([^)]+)\)/g, (_, src) => {
    imgs.push(src);
    return `\x00IMG${imgs.length - 1}\x00`;
  });
  // 2. 块级 HTML → 占位符
  const blocks = [];
  s = s.replace(BLOCK_TAGS, (m) => {
    blocks.push(m);
    return `\x00BLK${blocks.length - 1}\x00`;
  });
  // 3. 白名单内联标签 → 占位符
  const inlines = [];
  s = s.replace(SAFE_INLINE, (m) => {
    inlines.push(m);
    return `\x00TAG${inlines.length - 1}\x00`;
  });
  // 4. 围栏代码块 → 占位符(在 escape 之前)
  const fences = [];
  s = s.replace(FENCE_RE, (_, lang, code) => {
    fences.push({ lang: lang || "", code: code.replace(/\n$/, "") });
    return `\x00FENCE${fences.length - 1}\x00`;
  });
  s = s.replace(FENCE_SINGLELINE, (_, lang, code) => {
    fences.push({ lang: lang || "", code: code.replace(/\n$/, "") });
    return `\x00FENCE${fences.length - 1}\x00`;
  });
  // 5. KaTeX: 同时认 $$...$$ / $...$ (Markdown) 和 \[...\] / \(...\) (LaTeX 原生)
  //    原文输入给 katexRender,产物是已经 escape 过的安全 HTML,不会
  //    跟外层再 escape 冲突(占位符是 \x00XXX,不含 HTML 特殊字符)。
  const katexOut = [];
  s = s.replace(/\$\$([^$]+?)\$\$/g, (_, tex) => {
    katexOut.push(katexRender(tex, true));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/\$([^$\n]+?)\$/g, (_, tex) => {
    katexOut.push(katexRender(tex, false));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => {
    katexOut.push(katexRender(tex, true));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  s = s.replace(/\\\((.+?)\\\)/g, (_, tex) => {
    katexOut.push(katexRender(tex, false));
    return `\x00KTX${katexOut.length - 1}\x00`;
  });
  // 6. escape 剩余内容(占位符 \x00XXX 不含 <>&, 不会被破坏)
  s = escHtml(s);
  // 7. 块级占位符换回: 剥外层标签,对内部递归(防止 <table> 被再次提取造成死循环)
  s = s.replace(/\x00BLK(\d+)\x00/g, (_, i) => {
    const raw = blocks[+i];
    const m = raw.match(/^<(table|details)\b[^>]*>/i);
    if (!m) return raw;
    const tag = m[1].toLowerCase();
    const openLen = m[0].length;
    const closeIdx = raw.toLowerCase().lastIndexOf(`</${tag}>`);
    if (closeIdx < 0) return raw;
    return raw.slice(0, openLen)
         + formatContent(raw.slice(openLen, closeIdx))
         + raw.slice(closeIdx);
  });
  // 8. 白名单内联占位符换回
  s = s.replace(/\x00TAG(\d+)\x00/g, (_, i) => inlines[+i]);
  // 9. 围栏代码块占位换回:txt/text/plain 等伪代码标签不走词法高亮,只走 escHtml
  s = s.replace(/\x00FENCE(\d+)\x00/g, (_, i) => {
    const f = fences[+i];
    const langAttr = f.lang ? ` data-lang="${escHtml(f.lang)}"` : "";
    // 顺序很重要: 先 formatCode 在原始代码里插 <wbr> 软换行点,
    // 再 highlightCode 词法高亮(此时 <span> 完整,<wbr> 已经在源码里,不进 tag 属性)
    const withWbr = formatCode(f.code, f.lang);
    const inner = PLAIN_LANGS.test(f.lang) ? escHtml(withWbr) : highlightCode(withWbr, f.lang);
    return `<pre class="q-code"${langAttr}><code>${inner}</code></pre>`;
  });
  // 10. KaTeX 占位换回(直接拼产物,已含 escape 后的安全 HTML)
  s = s.replace(/\x00KTX(\d+)\x00/g, (_, i) => katexOut[+i]);
  // 11. 图片占位符换回 <img>(src 不存在时由 onerror 隐藏,避免破图)
  s = s.replace(/\x00IMG(\d+)\x00/g, (_, i) => {
    const src = imgs[+i];
    return `<img class="q-img" src="${escHtml(src)}" alt="题图" loading="lazy" onclick="zoomImg(this.src)" onerror="this.outerHTML='<span class=q-img-missing>⚠ 题图缺失: '+this.alt+'</span>'">`;
  });
  return s;
}

function katexRender(tex, displayMode) {
  // KaTeX 加载失败或语法错时回退原文,不阻塞刷题
  if (typeof katex === "undefined" || !katex.renderToString) {
    return displayMode ? `$$${tex}$$` : `$${tex}$`;
  }
  try {
    return katex.renderToString(tex, { throwOnError: false, displayMode });
  } catch (e) {
    return displayMode ? `$$${tex}$$` : `$${tex}$`;
  }
}

// 题图点击放大
function zoomImg(src) {
  const overlay = document.createElement("div");
  overlay.className = "q-img-zoom";
  overlay.innerHTML = `<img src="${escHtml(src)}" alt="题图放大">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============== 数据处理 ==============
function getBooks() {
  // 按指定顺序
  return ["操作系统", "数据结构", "计算机组成原理", "计算机网络"]
    .filter(b => ALL_QUESTIONS.some(q => q.book === b));
}

function getChapters(book) {
  const set = new Map();
  ALL_QUESTIONS.filter(q => q.book === book).forEach(q => {
    if (!set.has(q.chapter)) set.set(q.chapter, q.chapter_title);
  });
  return Array.from(set.entries()).sort((a, b) => a[0] - b[0]);
}

function buildQuestionList() {
  let qs;
  if (CURRENT.book == null) {
    // 全部题
    qs = ALL_QUESTIONS.slice();
  } else {
    qs = ALL_QUESTIONS.filter(q => q.book === CURRENT.book);
    if (CURRENT.chapter != null) qs = qs.filter(q => q.chapter === CURRENT.chapter);
  }
  if (CURRENT.mode === "random") qs = shuffle(qs);
  else if (CURRENT.mode === "wrong") qs = qs.filter(q => isWrong(q.id));
  else if (CURRENT.mode === "favorite") qs = qs.filter(q => isFav(q.id));
  else if (CURRENT.mode === "unattempted") qs = qs.filter(q => !STATE.attempted[q.id]);
  // 全部模式下,默认限制题数
  if (CURRENT.book == null && CURRENT.mode !== "wrong" && CURRENT.mode !== "favorite") {
    qs = qs.slice(0, CURRENT.limit);
  }
  return qs;
}

function setMode(mode) {
  CURRENT.mode = mode;
  CURRENT.questions = buildQuestionList();
  CURRENT.idx = 0;
  CURRENT.answers = {};
  resetAiPanel();
  render();
}

function setChapter(ch) {
  CURRENT.chapter = ch;
  CURRENT.questions = buildQuestionList();
  CURRENT.idx = 0;
  CURRENT.answers = {};
  resetAiPanel();
  render();
}

function setBook(b) {
  CURRENT.book = b;
  if (b) localStorage.setItem("408-quiz-last-book", b);
  CURRENT.chapter = null;
  // 切到"全部"自动转 random 模式
  if (b == null) {
    CURRENT.mode = "random";
  }
  CURRENT.questions = buildQuestionList();
  CURRENT.idx = 0;
  CURRENT.answers = {};
  resetAiPanel();
  render();
}

function nextBatch() {
  // 全部模式下,出下一组随机题
  CURRENT.questions = buildQuestionList();
  CURRENT.idx = 0;
  CURRENT.answers = {};
  resetAiPanel();
  render();
}

function toggleInstantGrade() {
  CURRENT.instantGrade = !CURRENT.instantGrade;
  localStorage.setItem("408-quiz-instant", JSON.stringify(CURRENT.instantGrade));
  render();
}

// ============== 渲染 ==============
function render() {
  renderHeader();
  renderBookTabs();
  renderChapterSel();
  renderModeTabs();
  renderQuiz();
}

function renderHeader() {
  const totalQs = ALL_QUESTIONS.length;
  const favCount = Object.keys(STATE.favorite).length;
  // 从权威源派生:已答(去重过的题目 ID 数)、错题、正确率 = (已答 - 当前错题) / 已答
  // 避免 STATE.stats.answered 累加计数器因重复作答而漂移
  const answeredCount = Object.keys(STATE.attempted).length;
  const wrongCount = Object.keys(STATE.wrong).length;
  const correctCount = Math.max(0, answeredCount - wrongCount);
  const correctRate = answeredCount > 0 ? Math.round(correctCount / answeredCount * 100) : 0;
  // 同步回计数器(防止后续代码读到漂移值)并持久化
  if (STATE.stats.answered !== answeredCount || STATE.stats.correct !== correctCount) {
    STATE.stats.answered = answeredCount;
    STATE.stats.correct = correctCount;
    persist();
  }
  $("#header-stats").innerHTML = `
    <span>题库 <strong>${totalQs}</strong></span>
    <span>已答 <strong>${answeredCount}</strong></span>
    <span>正确率 <strong>${correctRate}%</strong></span>
    <span>错题 <strong>${wrongCount}</strong></span>
    <span>收藏 <strong>${favCount}</strong></span>
  `;
}

function renderBookTabs() {
  const books = getBooks();
  if (CURRENT.book && !books.includes(CURRENT.book)) CURRENT.book = books[0];
  // "全部" entry 在最前
  const allCount = ALL_QUESTIONS.length;
  const allEntry = `<button class="book-entry ${CURRENT.book == null ? "active" : ""}" data-book="__all__" type="button">
    <span class="be-name">全部</span>
    <span class="be-count">${allCount} 题</span>
  </button>`;
  const bookEntries = books.map(b => {
    const count = ALL_QUESTIONS.filter(q => q.book === b).length;
    // 当前激活书的子筛选(错题 / 收藏)题数
    const mini = (CURRENT.book === b)
      ? ALL_QUESTIONS.filter(q => q.book === b && (CURRENT.chapter == null || q.chapter === CURRENT.chapter))
          .reduce((acc, q) => {
            if (isWrong(q.id)) acc.w++;
            if (isFav(q.id)) acc.f++;
            return acc;
          }, { w: 0, f: 0 })
      : { w: 0, f: 0 };
    const miniHtml = (CURRENT.book === b && (mini.w + mini.f) > 0)
      ? `<span class="be-mini">${mini.w ? `错 ${mini.w}` : ""}${mini.f ? ` · 收藏 ${mini.f}` : ""}</span>`
      : "";
    return `<button class="book-entry ${b === CURRENT.book ? "active" : ""}" data-book="${escHtml(b)}" type="button">
      <span class="be-name">${escHtml(b)}</span>
      ${miniHtml}
      <span class="be-count">${count}</span>
    </button>`;
  }).join("");
  $("#book-tabs").innerHTML = allEntry + bookEntries;
  $$("#book-tabs .book-entry").forEach(el => {
    el.onclick = () => {
      const v = el.dataset.book;
      setBook(v === "__all__" ? null : v);
    };
  });
}

function renderChapterSel() {
  const sel = $("#chapter-sel");
  if (CURRENT.book == null) {
    sel.innerHTML = `<option value="">全部章节 (跨 ${getBooks().length} 本书)</option>`;
    sel.disabled = true;
    sel.onchange = null;
    return;
  }
  sel.disabled = false;
  const chapters = getChapters(CURRENT.book);
  const totalAll = chapters.reduce((s, [n]) =>
    s + ALL_QUESTIONS.filter(q => q.book === CURRENT.book && q.chapter === n).length, 0);
  const opts = [`<option value="">全部章节 (${totalAll} 题)</option>`]
    .concat(chapters.map(([num, title]) => {
      const count = ALL_QUESTIONS.filter(q => q.book === CURRENT.book && q.chapter === num).length;
      return `<option value="${num}" ${CURRENT.chapter === num ? "selected" : ""}>第 ${num} 章 ${title} (${count})</option>`;
    }));
  sel.innerHTML = opts.join("");
  sel.onchange = (e) => {
    const v = e.target.value;
    setChapter(v === "" ? null : parseInt(v, 10));
  };
}

function renderModeTabs() {
  // 全部模式下,只显示 顺序/随机 (因为跨书,顺序没意义 -> 用 random)
  // 单书模式下显示 顺序/随机/错题/收藏/未做
  const wrongCount = CURRENT.book
    ? ALL_QUESTIONS.filter(q => q.book === CURRENT.book && (CURRENT.chapter == null || q.chapter === CURRENT.chapter) && isWrong(q.id)).length
    : 0;
  const favCount = CURRENT.book
    ? ALL_QUESTIONS.filter(q => q.book === CURRENT.book && (CURRENT.chapter == null || q.chapter === CURRENT.chapter) && isFav(q.id)).length
    : 0;
  const unattemptedCount = CURRENT.book
    ? ALL_QUESTIONS.filter(q => q.book === CURRENT.book && (CURRENT.chapter == null || q.chapter === CURRENT.chapter) && !STATE.attempted[q.id]).length
    : 0;
  const modes = [];
  if (CURRENT.book != null) modes.push({ id: "sequential", label: "顺序" });
  modes.push({ id: "random", label: "随机" });
  if (CURRENT.book != null) {
    modes.push({ id: "wrong", label: "错题", badge: wrongCount });
    modes.push({ id: "favorite", label: "收藏", badge: favCount });
    modes.push({ id: "unattempted", label: "未做", badge: unattemptedCount });
  }
  // 全部模式下的题量调节
  let limitCtrl = "";
  if (CURRENT.book == null) {
    limitCtrl = `<select id="limit-sel" class="mode-btn" style="background: var(--panel);">
      ${[20, 50, 100, 200].map(n => `<option value="${n}" ${CURRENT.limit === n ? "selected" : ""}>每刷 ${n} 题</option>`).join("")}
    </select>`;
  }
  // 即时判分开关
  const instantCtrl = `<button id="instant-toggle" class="mode-btn ${CURRENT.instantGrade ? "active" : ""}" title="点击选项立即判分">即时判分</button>`;
  // 刷新题库(进度归零:错题 + 已答 + 正确率)按钮 — 收藏保留
  const resetCtrl = `<button id="reset-wrong" class="mode-btn mode-btn-danger" title="刷新题库:清空错题 + 已答 + 正确率(收藏保留)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/><path d="M21 21v-5h-5"/></svg>刷新题库</button>`;
  $("#mode-tabs").innerHTML = modes.map(m =>
    `<button class="mode-btn ${m.id === CURRENT.mode ? "active" : ""}" data-mode="${m.id}">${m.label}${m.badge != null && m.badge > 0 ? `<span class="badge">${m.badge}</span>` : ""}</button>`
  ).join("");
  const extras = $("#mode-extras");
  if (extras) extras.innerHTML = limitCtrl + instantCtrl + resetCtrl;
  $$("#mode-tabs .mode-btn[data-mode]").forEach(el => {
    el.onclick = () => setMode(el.dataset.mode);
  });
  const limitSel = document.querySelector("#limit-sel");
  if (limitSel) {
    limitSel.onchange = (e) => {
      CURRENT.limit = parseInt(e.target.value, 10);
      localStorage.setItem("408-quiz-limit", String(CURRENT.limit));
      CURRENT.questions = buildQuestionList();
      CURRENT.idx = 0;
      CURRENT.answers = {};
      resetAiPanel();
      render();
    };
  }
  const instantBtn = document.querySelector("#instant-toggle");
  if (instantBtn) instantBtn.onclick = () => toggleInstantGrade();
  const resetBtn = document.querySelector("#reset-wrong");
  if (resetBtn) resetBtn.onclick = () => resetProgress();
}

function renderQuiz() {
  const area = $("#quiz-area");
  const qs = CURRENT.questions;
  if (qs.length === 0) {
    let emptyMsg = "该章节暂无题目";
    if (CURRENT.mode === "wrong") emptyMsg = "当前没有错题";
    else if (CURRENT.mode === "favorite") emptyMsg = "还没有收藏的题";
    else if (CURRENT.mode === "unattempted") emptyMsg = "本章节的题都已经做过,切到「顺序/随机」巩固一下吧";
    area.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    const rail = $("#ai-rail"); if (rail) rail.innerHTML = "";
    syncSession();
    return;
  }
  // 全部模式做完一组
  if (CURRENT.idx >= qs.length) {
    area.innerHTML = `
      <div class="empty">
        <div style="font-size: 18px; margin-bottom: 12px;">本组 ${qs.length} 题完成</div>
        <button class="btn btn-primary btn-accent" id="btn-next-batch">下一组 ${qs.length} 题</button>
        <button class="btn btn-ghost" id="btn-review" style="margin-left: 8px;">重新做这组</button>
      </div>
    `;
    const rail = $("#ai-rail"); if (rail) rail.innerHTML = "";
    $("#btn-next-batch").onclick = () => nextBatch();
    $("#btn-review").onclick = () => { CURRENT.idx = 0; CURRENT.answers = {}; resetAiPanel(); render(); };
    syncSession();
    return;
  }
  if (CURRENT.idx < 0) CURRENT.idx = 0;

  const q = qs[CURRENT.idx];
  const state = CURRENT.answers[q.id] || { selected: [], submitted: false };
  const isMulti = q.type === "multiple_choice";
  const instant = CURRENT.instantGrade;

  area.innerHTML = `
    <div class="q-meta">
      <span class="q-pos">Q <strong>${CURRENT.idx + 1}</strong><span class="q-pos-total">/ ${qs.length}</span></span>
      <span class="q-source">${escHtml(q.book)} · ${escHtml(q.chapter_title)} · ${escHtml(q.section)}${isMulti ? " · 多选" : ""}</span>
      <button class="img-toggle" type="button" id="imgToggle" aria-pressed="true" title="收起 / 展开题图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="img-toggle-label">图</span>
      </button>
    </div>
    <div class="q-stem">${formatContent(q.question)}</div>
    <div class="options" id="opts">
      ${["A", "B", "C", "D"].map(L => {
        const text = q.options[L] || "";
        let cls = "option";
        if (state.submitted) {
          cls += " disabled";
          if (q.answer.includes(L)) cls += " correct";
          else if (state.selected.includes(L)) cls += " wrong";
        } else if (state.selected.includes(L)) {
          cls += " selected";
        }
        return `<div class="${cls}" data-letter="${L}">
          <span class="opt-letter">${L}</span>
          <span class="opt-text">${formatContent(text)}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="actions">
      ${!state.submitted
        ? (instant && !isMulti)
          ? `<span class="action-hint">即时判分已开启,点击选项立即判分</span>
             <button class="btn btn-ghost action-spacer" id="btn-skip">跳过</button>`
          : instant && isMulti
          ? `<button class="btn btn-primary btn-accent" id="btn-submit">提交 (${state.selected.length || 0}/${q.answer.length})</button>
             <button class="btn btn-ghost" id="btn-skip">跳过</button>
             <span class="action-hint action-spacer">选对继续,选错立即判错,选全立即判对</span>`
          : `<button class="btn btn-primary btn-accent" id="btn-submit">提交${isMulti ? " (多选)" : ""}</button>
             <button class="btn btn-ghost" id="btn-skip">跳过</button>
             <button class="btn btn-ghost action-spacer" id="btn-show">显示答案</button>`
        : `<button class="btn btn-primary btn-accent" id="btn-next">下一题 →</button>`}
      <button class="btn btn-fav ${isFav(q.id) ? "active" : ""}" id="btn-fav">${isFav(q.id) ? "★ 已收藏" : "☆ 收藏"}</button>
    </div>
    <div class="feedback ${state.submitted ? "show" : ""} ${state.submitted ? (state.shown ? "info" : (state.correct ? "correct" : "wrong")) : ""}" id="fb">
      ${state.submitted ? `
        <div class="fb-head"><span class="status-pill ${state.shown ? "" : (state.correct ? "correct" : "wrong")}">${state.shown ? "已查看答案" : (state.correct ? "正确" : "错误")}</span></div>
        <div class="fb-answer">正确答案: <strong>${q.answer.join("、")}</strong>${state.selected.length ? ` · 你的答案: ${state.selected.join("、")}${state.shown ? " (仅供参考)" : ""}` : ""}</div>
        <div class="fb-expl">${formatContent(q.explanation)}</div>
      ` : ""}
    </div>
    <div class="actions actions-secondary">
      <button class="btn btn-ghost" id="btn-prev">← 上一题</button>
      <button class="btn btn-ghost action-spacer" id="btn-next2">下一题 →</button>
    </div>
  `;

  // 单独渲染右侧 AI 栏(始终展开,折叠/抽屉态由 .ai-rail class 控制)
  renderAiPanel(q, state);

  function selectAnswer(L) {
    const cur = CURRENT.answers[q.id] || { selected: [], submitted: false };
    if (cur.submitted) return;
    let sel = cur.selected.slice();
    if (isMulti) {
      if (sel.includes(L)) sel = sel.filter(x => x !== L);
      else sel.push(L);
    } else {
      sel = [L];
    }
    // 即时判分
    if (instant) {
      if (!isMulti) {
        // 单选:点完立即判
        CURRENT.answers[q.id] = { selected: sel, submitted: false };  // 暂时不 submitted,等 grade 完
        autoGrade(q, sel);
        return;
      } else {
        // 多选:
        //  - 选了错误选项 → 立即判错
        //  - 选完所有正确答案 → 立即判对
        //  - 否则:只更新 selected,等用户继续选
        const correctSet = new Set(q.answer);
        const isCorrectSoFar = sel.length > 0 &&
          sel.every(x => correctSet.has(x)) &&
          sel.length === q.answer.length;
        const hasWrong = sel.some(x => !correctSet.has(x));
        if (hasWrong || isCorrectSoFar) {
          autoGrade(q, sel);
          return;
        }
        CURRENT.answers[q.id] = { ...cur, selected: sel };
        renderQuiz();
        return;
      }
    }
    // 普通模式
    CURRENT.answers[q.id] = { ...cur, selected: sel };
    renderQuiz();
  }

  // 绑定事件
  if (!state.submitted) {
    $$("#opts .option").forEach(el => {
      el.onclick = () => {
        selectAnswer(el.dataset.letter);
      };
    });
    const submitBtn = document.querySelector("#btn-submit");
    if (submitBtn) submitBtn.onclick = () => submit();
    const skipBtn = document.querySelector("#btn-skip");
    if (skipBtn) skipBtn.onclick = () => goNext();
    const showBtn = document.querySelector("#btn-show");
    if (showBtn) showBtn.onclick = () => showAnswer();
  } else {
    $("#btn-next").onclick = () => goNext();
  }
  $("#btn-prev").onclick = () => goPrev();
  $("#btn-next2").onclick = () => goNext();
  $("#btn-fav").onclick = () => { toggleFav(q.id); render(); };
  // AI 面板在右侧栏独立渲染,bindAiPanel 由 renderAiPanel 内部调用
  $("#imgToggle").onclick = () => {
    imgVisible = !imgVisible;
    localStorage.setItem(IMG_VIS_KEY, imgVisible ? "1" : "0");
    applyImgVis();
  };
  const panelToggle = $("#panelToggle");
  if (panelToggle) panelToggle.onclick = () => {
    // 收起按钮已移除,handler 保留为 noop
  };

  syncSession();
  applyImgVis();
  applyPanel();
}

function autoGrade(q, sel) {
  // 即时判分:更新 state + 统计
  const correct = arraysEqual([...sel].sort(), [...q.answer].sort());
  const state = { selected: sel, submitted: true, correct, shown: false };
  CURRENT.answers[q.id] = state;
  markAttempted(q.id);
  STATE.stats.answered += 1;
  if (correct) {
    STATE.stats.correct += 1;
    removeWrong(q.id);
  } else {
    addWrong(q.id);
  }
  persist();
  // 如果是最后一题,自动推进到 batch 完成屏
  if (CURRENT.idx === CURRENT.questions.length - 1) {
    CURRENT.idx = CURRENT.questions.length;
  }
  render();
  flashCard(q.id, correct ? "correct" : "wrong");
}

function syncSession() {
  saveSession();
}

// 答题反馈闪光:答对 bloom(纸面轻拍),答错 shake(纸面轻震),查看答案 bloom(中性轻拍)
// 题面左线同步切换为 success / error / primary,题卡本体一次性动画后回归常态
function flashCard(qid, kind) {
  // 同一题重复触发(切回来查看已答题)不重复闪,避免视觉骚扰
  if (LAST_FLASHED_QID === qid) return;
  LAST_FLASHED_QID = qid;
  if (FLASH_TIMER) clearTimeout(FLASH_TIMER);
  const area = $("#quiz-area");
  const stem = area && area.querySelector(".q-stem");
  if (!area || !stem) return;
  const stemCls = kind === "correct" ? "flash-correct" : (kind === "wrong" ? "flash-wrong" : "flash-info");
  stem.classList.remove("flash-correct", "flash-wrong", "flash-info");
  stem.classList.add(stemCls);
  FLASH_TIMER = setTimeout(() => {
    stem.classList.remove(stemCls);
  }, 900);
  area.classList.remove("bloom");
  area.classList.add("bloom");
  setTimeout(() => area.classList.remove("bloom"), 600);
}

function plainText(htmlish) {
  const box = document.createElement("div");
  box.innerHTML = String(htmlish || "");
  return box.textContent.replace(/\s+/g, " ").trim();
}

function getQuestionContext(q, state, extra = "") {
  const selected = state && state.selected && state.selected.length
    ? state.selected.join("、")
    : "尚未选择";
  const lines = [
    "# 408 刷题上下文",
    "",
    `- 题源: ${q.book}`,
    `- 章节: 第 ${q.chapter} 章 ${q.chapter_title}`,
    `- 小节: ${q.section || "—"}`,
    `- 题型: ${q.type === "multiple_choice" ? "多选题" : "单选题"}`,
    `- 当前选择: ${selected}`,
    `- 正确答案: ${q.answer.join("、")}`,
    "",
    "## 题目",
    plainText(q.question),
    "",
    "## 选项",
    ...["A", "B", "C", "D"].map(L => `${L}. ${plainText(q.options[L] || "")}`),
    "",
    "## 解析",
    plainText(q.explanation || "暂无解析")
  ];
  if (extra) {
    lines.push("", "## 我的追问", extra);
  }
  return lines.join("\n");
}

function buildAiIntro(q, state) {
  const status = state.selected && state.selected.length
    ? `你当前选了 ${state.selected.join("、")}。`
    : "你还没有选择答案。";
  return [
    "已加载本题上下文。",
    status,
    "可以让我先讲解思路，也可以复制完整上下文给 Claudian，让它继续追问或保存到 Obsidian。"
  ].join("\n");
}

function buildAiExplanation(q, state) {
  const answerLine = `这题答案是 ${q.answer.join("、")}。`;
  const typeLine = q.type === "multiple_choice"
    ? "这是多选题，先判断每个选项是否独立成立，再看是否存在互斥项。"
    : "这是单选题，先抓题干限定词，再排除明显不符合定义或条件的选项。";
  const expl = plainText(q.explanation || "");
  return [
    answerLine,
    typeLine,
    "",
    expl ? `题库解析：${expl}` : "题库暂时没有解析，可以把上下文复制给 Claudian 继续追问。"
  ].join("\n");
}

function buildMistakeReview(q, state) {
  const selected = state.selected && state.selected.length ? state.selected : [];
  const wrongPicked = selected.filter(x => !q.answer.includes(x));
  const missed = q.answer.filter(x => !selected.includes(x));
  const parts = [];
  if (!selected.length) parts.push("你还没选答案。建议先凭第一判断做一次，再看错因分析。");
  if (wrongPicked.length) parts.push(`可能误选：${wrongPicked.join("、")}。回到题干限定条件，检查这些选项是否偷换概念或范围过大。`);
  if (missed.length) parts.push(`可能漏选：${missed.join("、")}。多选题尤其要检查“成立但不显眼”的选项。`);
  if (!wrongPicked.length && !missed.length && selected.length) parts.push("你的选择和答案一致。可以把重点放在复述解题依据，而不是只记答案。");
  parts.push("", `正确答案：${q.answer.join("、")}`);
  return parts.join("\n");
}

function buildObsidianNote(q, state) {
  const selected = state.selected && state.selected.length ? state.selected.join("、") : "未作答";
  const result = state.submitted
    ? (state.shown ? "查看答案" : (state.correct ? "正确" : "错误"))
    : "未提交";
  return [
    "---",
    "type: 408错题",
    `book: ${q.book}`,
    `chapter: ${q.chapter}`,
    `section: ${q.section || q.chapter_title}`,
    `result: ${result}`,
    `created: ${new Date().toISOString().slice(0, 10)}`,
    "---",
    "",
    `# ${q.book} 第 ${q.chapter} 章错题`,
    "",
    "## 题目",
    plainText(q.question),
    "",
    "## 选项",
    ...["A", "B", "C", "D"].map(L => `- ${L}. ${plainText(q.options[L] || "")}`),
    "",
    "## 作答",
    `- 我的答案：${selected}`,
    `- 正确答案：${q.answer.join("、")}`,
    `- 结果：${result}`,
    "",
    "## 解析",
    plainText(q.explanation || "待补充"),
    "",
    "## 下次复习提醒",
    "- [ ] 复述题干考点",
    "- [ ] 解释每个干扰项为什么不选"
  ].join("\n");
}

async function copyText(text, okMsg = "已复制") {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast(okMsg);
  }
}

// ============== AI API 配置 ==============
const AI_CFG_KEY = "408-quiz-ai-cfg";
function getAiCfg() {
  try { return JSON.parse(localStorage.getItem(AI_CFG_KEY) || "null") || {}; }
  catch (e) { return {}; }
}
function setAiCfg(cfg) { localStorage.setItem(AI_CFG_KEY, JSON.stringify(cfg)); }
function clearAiCfg() { localStorage.removeItem(AI_CFG_KEY); }
function hasAiCfg() { const c = getAiCfg(); return !!(c.baseUrl && c.model); }
function aiModeLabel() {
  const c = getAiCfg();
  return c.model ? `API · ${c.model}` : "Local";
}
function inferProtocol(baseUrl) {
  return /anthropic/i.test(baseUrl || "") ? "anthropic" : "openai";
}
function buildAiMessages(mode, q, state, extra) {
  const ctx = getQuestionContext(q, state, extra);
  const sys = "你是 408 考研刷题助手。中文作答，使用 Markdown，直接给结论与依据，不要寒暄。";
  const user = {
    explain: `【任务：讲解思路】用 3-5 步拆解本题解题路径，逐项解释每个选项为什么对/错。\n\n${ctx}`,
    mistake: `【任务：错因分析】基于用户当前作答与正确答案，指出可能的误解、漏判的限定条件、容易混淆的概念。\n\n${ctx}`,
    note: `【任务：Obsidian 笔记】输出可直接粘贴到 Obsidian 的 Markdown 错题卡：yaml frontmatter + 题目 + 关键考点 + 错因 + 复习提醒，不加客套。\n\n${ctx}`,
    ask:   `【任务：针对性回答】用户追问："${extra}"。基于上下文给出有依据的回答。\n\n${ctx}`
  }[mode] || ctx;
  return [
    { role: "system", content: sys },
    { role: "user", content: user }
  ];
}
async function callAiApi(messages) {
  const cfg = getAiCfg();
  if (!cfg.baseUrl || !cfg.model) throw new Error("未配置 API");
  const protocol = cfg.protocol && cfg.protocol !== "auto" ? cfg.protocol : inferProtocol(cfg.baseUrl);
  const base = cfg.baseUrl.replace(/\/+$/, "");
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 120000);
  try {
    if (protocol === "anthropic") return await requestAnthropic(base, cfg, messages, ctrl);
    return await requestOpenAINonStream(base, cfg, messages, ctrl);
  } finally {
    clearTimeout(t);
  }
}

// 流式入口:OpenAI 兼容,逐 token 回调 onDelta(text),流末返回完整文本
// Anthropic 暂不支持流式,本入口仅在协议为 openai 时被使用
async function streamAiApi(messages, onDelta, externalCtrl) {
  const cfg = getAiCfg();
  if (!cfg.baseUrl || !cfg.model) throw new Error("未配置 API");
  const protocol = cfg.protocol && cfg.protocol !== "auto" ? cfg.protocol : inferProtocol(cfg.baseUrl);
  const base = cfg.baseUrl.replace(/\/+$/, "");
  const ctrl = externalCtrl || new AbortController();
  const ownTimer = !externalCtrl;
  const t = ownTimer ? setTimeout(() => ctrl.abort(), 180000) : null;
  try {
    if (protocol === "anthropic") {
      // 暂走非流式
      const text = await requestAnthropic(base, cfg, messages, ctrl);
      if (onDelta) onDelta(text);
      return text;
    }
    return await streamOpenAI(base, cfg, messages, ctrl, onDelta);
  } finally {
    if (t) clearTimeout(t);
  }
}

function buildOpenAIHeaders(cfg) {
  return {
    "Content-Type": "application/json",
    "Accept": "text/event-stream",
    ...(cfg.apiKey ? { "Authorization": `Bearer ${cfg.apiKey}` } : {})
  };
}

async function requestOpenAINonStream(base, cfg, messages, ctrl) {
  const url = base + "/chat/completions";
  const body = { model: cfg.model, messages, stream: false, temperature: 0.4 };
  const resp = await safeFetch(url, buildOpenAIHeaders(cfg), body, ctrl);
  const data = await resp.json();
  const content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  if (!content) throw new Error("响应里没有可读字段 — 检查 baseUrl / model / 协议 是否匹配");
  return content;
}

async function streamOpenAI(base, cfg, messages, ctrl, onDelta) {
  const url = base + "/chat/completions";
  const body = { model: cfg.model, messages, stream: true, temperature: 0.4 };
  let resp;
  try {
    resp = await fetch(url, { method: "POST", headers: buildOpenAIHeaders(cfg), body: JSON.stringify(body), signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "请求超时 (180s)" : `网络错误: ${e.message || e}`);
  }
  if (!resp.ok) {
    const txt = await resp.text().catch(() => "");
    throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 240)}`);
  }
  if (!resp.body || !resp.body.getReader) {
    // 浏览器不支持 ReadableStream:回退到一次性
    const data = await resp.json();
    const content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    if (onDelta) onDelta(content);
    return content;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder("utf-8");
  let buf = "";
  let acc = "";
  let done = false;
  while (!done) {
    const r = await reader.read();
    if (r.done) { done = true; break; }
    buf += dec.decode(r.value, { stream: true });
    // SSE:按 \n\n 切分
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        const m = line.match(/^data:\s*(.*)$/);
        if (!m) continue;
        const payload = m[1];
        if (payload === "[DONE]") { done = true; break; }
        if (!payload) continue;
        try {
          const j = JSON.parse(payload);
          const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (delta) { acc += delta; if (onDelta) onDelta(delta); }
        } catch (_) { /* 忽略非 JSON 帧 */ }
      }
    }
  }
  return acc;
}

async function requestAnthropic(base, cfg, messages, ctrl) {
  const url = base + "/v1/messages";
  const headers = {
    "Content-Type": "application/json",
    "anthropic-version": "2023-06-01",
    ...(cfg.apiKey ? { "x-api-key": cfg.apiKey } : {})
  };
  const sysMsg = (messages.find(m => m.role === "system") || {}).content || "";
  const userMsgs = messages.filter(m => m.role !== "system");
  const userContent = userMsgs.map(m => m.content).join("\n\n");
  const body = {
    model: cfg.model,
    max_tokens: 2048,
    messages: [{ role: "user", content: sysMsg ? `${sysMsg}\n\n${userContent}` : userContent }]
  };
  const resp = await safeFetch(url, headers, body, ctrl);
  const data = await resp.json();
  const content = (data.content && data.content[0] && data.content[0].text) || "";
  if (!content) throw new Error("响应里没有可读字段 — 检查 baseUrl / model / 协议 是否匹配");
  return content;
}

async function safeFetch(url, headers, body, ctrl) {
  let resp;
  try {
    resp = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: ctrl.signal });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "请求超时" : `网络错误: ${e.message || e}`);
  }
  if (!resp.ok) {
    const txt = await resp.text().catch(() => "");
    throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 240)}`);
  }
  return resp;
}

function renderAiPanel(q, state) {

        <div class="ai-title"><span class="ai-title-main">AI 讲题</span><small id="ai-mode-label">${aiModeLabel()}</small></div>
        <div class="ai-head-tools">
          <button class="ai-gear ${hasAiCfg() ? "active" : ""}" type="button" id="ai-gear" aria-label="配置 API">⚙</button>
          <button class="ai-close" type="button" id="ai-close" aria-label="收起 AI 栏">×</button>
        </div>
      </div>
      <div class="ai-cfg" id="ai-cfg" ${CURRENT.aiCfgOpen ? "" : "hidden"}>
        <div class="ai-cfg-row">
          <label>Base URL<input id="cfg-url" placeholder="https://api.deepseek.com" autocomplete="off"></label>
          <label>Model<input id="cfg-model" placeholder="deepseek-v4-flash" autocomplete="off"></label>
          <label>协议
            <select id="cfg-proto" autocomplete="off">
              <option value="auto">自动(从 Base URL 推断)</option>
              <option value="openai">OpenAI 兼容 · /chat/completions</option>
              <option value="anthropic">Anthropic 兼容 · /v1/messages</option>
            </select>
          </label>
          <label>Key (可选)<input id="cfg-key" type="password" placeholder="Ollama / 本地不需要" autocomplete="off"></label>
        </div>
        <div class="ai-cfg-row ai-cfg-actions">
          <button class="btn btn-primary" type="button" id="cfg-save">保存配置</button>
          <button class="btn" type="button" id="cfg-clear">清除</button>
          <span class="ai-cfg-hint" id="cfg-status"></span>
        </div>
      </div>
      <div class="ai-body">
        <div class="ai-context">
          <div class="ai-context-row ai-context-row-source">
            <span class="ai-context-rule" aria-hidden="true"></span>
            <svg class="ai-context-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 3.5h4M2.5 8h4M2.5 12.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
              <path d="M9.5 3.5h4M9.5 8h4M9.5 12.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.45"/>
            </svg>
            <span class="ai-context-source" id="ai-source">${escHtml(q.book)} / 第 ${q.chapter} 章 / ${escHtml(q.section || q.chapter_title)}</span>
          </div>
          <div class="ai-context-row ai-context-row-state">
            <span class="ai-context-state" id="ai-state">${state.selected.length ? `已选 ${state.selected.join("、")}` : "尚未选择"}${state.submitted ? ` / ${state.shown ? "已查看答案" : (state.correct ? "已答对" : "已答错")}` : ""}</span>
            <button class="ai-copy-inline" id="ai-copy" type="button" title="复制 Markdown 上下文到剪贴板">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="4.5" y="4.5" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/>
                <path d="M3 11.5V3a1 1 0 0 1 1-1h7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <span>复制上下文</span>
            </button>
          </div>
        </div>
        <div class="ai-output-area">
          <div class="ai-output" id="ai-output">
            ${CURRENT.aiOutput
              ? renderMarkdown(CURRENT.aiOutput)
              : (() => { const t = pickAiEmptyTip(); return `<div class="ai-empty"><div class="ai-empty-mark">—</div><div class="ai-empty-quote">${escHtml(t.text)}</div>${t.author ? `<div class="ai-empty-author">— ${escHtml(t.author)}</div>` : ""}<div class="ai-empty-rule"></div><div class="ai-empty-hint">点击「询问 AI」或在下方输入追问</div></div>`; })()
            }
          </div>
        </div>
        <div class="ai-input-row">
          <input id="ai-question" type="text" placeholder="追问：按回车发送,Shift+Enter 换行">
          <button class="btn btn-primary" type="button" id="ai-ask">询问 AI</button>
        </div>
        <div class="ai-quick" id="ai-quick">
          <div class="ai-quick-row">
            <span class="ai-quick-item">本组 <strong>${CURRENT.idx + 1} / ${CURRENT.questions.length}</strong></span>
            <div class="ai-quick-bar"><span style="width: ${CURRENT.questions.length > 0 ? Math.round((CURRENT.idx + 1) / CURRENT.questions.length * 100) : 0}%"></span></div>
          </div>
          <div class="ai-quick-row">
            <span class="ai-quick-item ai-quick-acc">正确率 <strong>${(STATE.stats.answered > 0 ? Math.round(STATE.stats.correct / STATE.stats.answered * 100) : 0)}%</strong></span>
            <span class="ai-quick-sep">·</span>
            <span class="ai-quick-item ai-quick-wrong">本章节错题 <strong>${CURRENT.book ? ALL_QUESTIONS.filter(qq => qq.book === CURRENT.book && (CURRENT.chapter == null || qq.chapter === CURRENT.chapter) && isWrong(qq.id)).length : Object.keys(STATE.wrong).length}</strong></span>
          </div>
        </div>
      </div>
    </div>
  `;
  bindAiPanel(q, state);
  // 折叠把手/抽屉把手 点击恢复 — 用 onclick 避免 renderQuiz 反复调用时 listener 累积
  rail.onclick = (e) => {
    if (window.matchMedia("(max-width: 1024px)").matches) {
      // 移动抽屉:点 ai-head(把手区域)切换展开/收起
      if (e.target.closest(".ai-head")) {
        rail.classList.toggle("is-open");
      }
    } else {
      // 桌面:折叠态时点 rail(除关按钮外)恢复
      if (rail.classList.contains("is-collapsed") && !e.target.closest("#ai-close")) {
        CURRENT.aiRailCollapsed = false;
        rail.classList.remove("is-collapsed");
      }
    }
  };
}

function bindAiPanel(q, state) {
  const shell = $("#ai-shell");
  if (!shell) return;
  // 关按钮 → 折叠/展开右侧 AI 栏
  $("#ai-close").onclick = () => {
    // 在移动抽屉模式下,关按钮 = 收起抽屉;桌面下 = 折叠到把手
    if (window.matchMedia("(max-width: 1024px)").matches) {
      const rail = $("#ai-rail");
      if (rail) rail.classList.remove("is-open");
    } else {
      CURRENT.aiRailCollapsed = !CURRENT.aiRailCollapsed;
      const rail = $("#ai-rail");
      if (rail) rail.classList.toggle("is-collapsed", CURRENT.aiRailCollapsed);
    }
  };

  // 配置区
  const cfg = getAiCfg();
  const urlInput = $("#cfg-url");
  const modelInput = $("#cfg-model");
  const protoSelect = $("#cfg-proto");
  const keyInput = $("#cfg-key");
  const status = $("#cfg-status");
  const gear = $("#ai-gear");
  const cfgBox = $("#ai-cfg");
  // 默认值只预填到输入框,不写进 getAiCfg()——避免 ⚙ 误显示已配置激活态
  const DEFAULT_BASE_URL = "https://api.deepseek.com";
  const DEFAULT_MODEL = "deepseek-v4-flash";
  urlInput.value = cfg.baseUrl || DEFAULT_BASE_URL;
  modelInput.value = cfg.model || DEFAULT_MODEL;
  keyInput.value = cfg.apiKey || "";
  protoSelect.value = cfg.protocol || "auto";
  gear.onclick = () => {
    CURRENT.aiCfgOpen = !CURRENT.aiCfgOpen;
    cfgBox.hidden = !CURRENT.aiCfgOpen;
  };
  $("#cfg-save").onclick = () => {
    const baseUrl = urlInput.value.trim();
    const model = modelInput.value.trim();
    const apiKey = keyInput.value.trim();
    const protocol = protoSelect.value || "auto";
    if (!baseUrl || !model) {
      status.textContent = "需要 baseUrl + model";
      return;
    }
    setAiCfg({ baseUrl, model, apiKey, protocol });
    gear.classList.add("active");
    $("#ai-mode-label").textContent = `API · ${model}`;
    const resolved = protocol === "auto" ? (inferProtocol(baseUrl) === "anthropic" ? "Anthropic" : "OpenAI") : (protocol === "anthropic" ? "Anthropic" : "OpenAI");
    status.textContent = `已保存(协议: ${resolved})。点"询问 AI"会直接发请求,失败自动回退到本地整理。`;
  };
  $("#cfg-clear").onclick = () => {
    clearAiCfg();
    urlInput.value = "";
    modelInput.value = "";
    keyInput.value = "";
    protoSelect.value = "auto";
    gear.classList.remove("active");
    $("#ai-mode-label").textContent = "Local";
    status.textContent = "已切回本地整理模式。";
  };

  // 追问运行器:有 API 配置就走流式(OpenAI 兼容),否则本地 builder 拼出追问上下文
  let askAbort = null;  // 当前进行中的请求 AbortController
  async function runAsk(ask) {
    if (!hasAiCfg()) {
      setAiOutput("");
      copyText(getQuestionContext(q, state, ask), "追问上下文已复制");
      return;
    }
    // 切到"生成中"态:按钮变"停止"
    const askBtn = $("#ai-ask");
    const origText = askBtn.textContent;
    askBtn.textContent = "停止";
    askBtn.classList.add("is-loading");
    startAiStream();
    // 重新挂一次性 abort 行为:再次点击按钮则中断
    askAbort = new AbortController();
    const onDelta = (d) => appendAiDelta(d);
    try {
      const text = await streamAiApi(buildAiMessages("ask", q, state, ask), onDelta, askAbort);
      // 末尾清理:不再追加光标
      CURRENT.aiOutput = text;
      endAiStream();
    } catch (e) {
      const fallback = getQuestionContext(q, state, ask);
      CURRENT.aiOutput = `⚠️ API 调用失败:${e.message}\n\n—— 已回退到本地整理 ——\n\n${fallback}`;
      endAiStream();
    } finally {
      askBtn.textContent = origText;
      askBtn.classList.remove("is-loading");
      askAbort = null;
    }
  }

  $("#ai-copy").onclick = () => copyText(getQuestionContext(q, state), "上下文已复制");
  const askInput = $("#ai-question");
  askInput.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("#ai-ask").click();
    }
  };
  $("#ai-ask").onclick = async () => {
    const askBtn = $("#ai-ask");
    // 正在生成中:再次点击 = 中断
    if (askBtn.classList.contains("is-loading") && askAbort) {
      askAbort.abort();
      return;
    }
    const ask = askInput.value.trim();
    if (!ask) { toast("先写一句追问"); return; }
    askInput.value = "";
    await runAsk(ask);
  };
}

function submit() {
  const q = CURRENT.questions[CURRENT.idx];
  if (!q) return;
  const cur = CURRENT.answers[q.id] || { selected: [] };
  if (cur.selected.length === 0) {
    toast("请先选择答案");
    return;
  }
  const correct = arraysEqual([...cur.selected].sort(), [...q.answer].sort());
  cur.submitted = true;
  cur.correct = correct;
  CURRENT.answers[q.id] = cur;
  markAttempted(q.id);
  STATE.stats.answered += 1;
  if (correct) {
    STATE.stats.correct += 1;
    removeWrong(q.id);  // 答对,从错题本移除
  } else {
    addWrong(q.id);
  }
  persist();
  // 如果是最后一题,自动推进到 batch 完成屏
  if (CURRENT.idx === CURRENT.questions.length - 1) {
    CURRENT.idx = CURRENT.questions.length;
  }
  render();
  flashCard(q.id, correct ? "correct" : "wrong");
}

function showAnswer() {
  const q = CURRENT.questions[CURRENT.idx];
  if (!q) return;
  const cur = CURRENT.answers[q.id] || { selected: [] };
  cur.submitted = true;
  cur.shown = true;     // 标记为"只查看",不计入错题本
  cur.correct = false;  // 占位 - 不会被统计
  CURRENT.answers[q.id] = cur;
  // 不写入统计、不入错题本
  render();
  flashCard(q.id, "info");
}

function goNext() {
  if (CURRENT.idx < CURRENT.questions.length - 1) {
    CURRENT.idx++;
    resetAiPanel();
    renderQuiz();
  } else {
    toast("已经是最后一题");
  }
}

function goPrev() {
  if (CURRENT.idx > 0) {
    CURRENT.idx--;
    resetAiPanel();
    renderQuiz();
  } else {
    toast("已经是第一题");
  }
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

// ============== 键盘快捷键 ==============
function normalizeChoiceKey(e) {
  const map = { "1": "A", "2": "B", "3": "C", "4": "D" };
  if (map[e.key]) return map[e.key];
  const k = e.key.toUpperCase();
  return ["A", "B", "C", "D"].includes(k) ? k : null;
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return el.isContentEditable || tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA";
}

document.addEventListener("keydown", (e) => {
  if (isTypingTarget(e.target)) return;
  const q = CURRENT.questions[CURRENT.idx];
  if (!q) return;
  const state = CURRENT.answers[q.id] || { selected: [], submitted: false };
  const choice = normalizeChoiceKey(e);

  if (choice && !state.submitted) {
    e.preventDefault();
    const L = choice;
    const isMulti = q.type === "multiple_choice";
    let sel = state.selected.slice();
    if (isMulti) {
      if (sel.includes(L)) sel = sel.filter(x => x !== L);
      else sel.push(L);
    } else {
      sel = [L];
    }
    // 即时判分
    if (CURRENT.instantGrade) {
      if (!isMulti) {
        autoGrade(q, sel);
        return;
      } else {
        const correctSet = new Set(q.answer);
        const hasWrong = sel.some(x => !correctSet.has(x));
        const isComplete = sel.length === q.answer.length &&
          sel.every(x => correctSet.has(x));
        if (hasWrong || isComplete) {
          autoGrade(q, sel);
          return;
        }
      }
    }
    CURRENT.answers[q.id] = { ...state, selected: sel };
    renderQuiz();
    return;
  }

  if (e.key === "Enter") {
    e.preventDefault();
    if (!state.submitted) {
      if (state.selected.length > 0) submit();
    } else {
      goNext();
    }
  } else if (e.key === "ArrowLeft") {
    e.preventDefault(); goPrev();
  } else if (e.key === "ArrowRight") {
    e.preventDefault(); goNext();
  } else if (e.key === " ") {
    e.preventDefault();
    if (!state.submitted) showAnswer();
  } else if (e.key === "f" || e.key === "F") {
    if (q) { toggleFav(q.id); render(); }
  }
});

// ============== 启动 ==============
bindBackupControls();

// ============== 金句批注 ==============
// 每天固定一句(日期种子)起手,但题库导航那一行允许 ‹/› 手动切换;
// 手动切过的 index 不写 localStorage — 跨天会重置回"今天那句",避免装饰物污染状态。
// CS 先驱 / 西方思想 / 中文古典 5:5 混合,跟 Atelier Zero 纸面编辑感对齐。
const QUOTES = [
  { text: "Stay hungry, stay foolish.", author: "Steve Jobs" },
  { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
  { text: "Premature optimization is the root of all evil.", author: "Donald Knuth" },
  { text: "In the midst of winter, I found there was, within me, an invincible summer.", author: "Albert Camus" },
  { text: "Simplicity is a great virtue but it requires hard work to achieve it.", author: "Edsger Dijkstra" },
  { text: "采菊东篱下，悠然见南山。", author: "陶渊明 · 饮酒" },
  { text: "回首向来萧瑟处，归去，也无风雨也无晴。", author: "苏轼 · 定风波" },
  { text: "大方无隅，大器晚成。", author: "老子 · 道德经" },
  { text: "为天地立心，为生民立命，为往圣继绝学，为万世开太平。", author: "张载 · 横渠四句" },
  { text: "纸上得来终觉浅，绝知此事要躬行。", author: "陆游 · 冬夜读书" },
];

// 两个金句独立随机,保证不等 — 每次刷新都是新搭配,跨天也随机。
let QUOTE_INDEX_H = Math.floor(Math.random() * QUOTES.length);
let QUOTE_INDEX_N = (QUOTE_INDEX_H + 1 + Math.floor(Math.random() * (QUOTES.length - 1))) % QUOTES.length;

function stepQuote(delta) {
  QUOTE_INDEX_N = (QUOTE_INDEX_N + delta + QUOTES.length) % QUOTES.length;
  renderQuotes();
}

function renderQuotes() {
  const h = QUOTES[QUOTE_INDEX_H], n = QUOTES[QUOTE_INDEX_N];
  const safeH = { t: escHtml(h.text), a: escHtml(h.author) };
  const safeN = { t: escHtml(n.text), a: escHtml(n.author) };
  const hq = $("#header-quote");
  if (hq) hq.innerHTML = `<span class="hq-text">"${safeH.t}"</span><span class="hq-author">— ${safeH.a}</span>`;
  // nav 那一行多两个 18px 小方块按钮,只切 nav 不动 header
  const nq = $("#nav-quote");
  if (nq) nq.innerHTML =
    `<span class="nq-text">"${safeN.t}"</span>` +
    `<span class="nq-author">— ${safeN.a}</span>` +
    `<span class="nq-switches">` +
      `<button class="nq-btn" type="button" aria-label="上一句" onclick="stepQuote(-1)">‹</button>` +
      `<button class="nq-btn" type="button" aria-label="下一句" onclick="stepQuote(1)">›</button>` +
    `</span>`;
}

renderQuotes();

// 加载持久化偏好
try {
  const instant = localStorage.getItem("408-quiz-instant");
  if (instant != null) CURRENT.instantGrade = JSON.parse(instant);
  const lim = localStorage.getItem("408-quiz-limit");
  if (lim != null) CURRENT.limit = parseInt(lim, 10) || 50;
} catch (e) {}

fetch("data.json")
  .then(r => r.json())
  .then(data => {
    ALL_QUESTIONS = data.questions || [];
    if (ALL_QUESTIONS.length === 0) {
      $("#quiz-area").innerHTML = `<div class="empty">题库为空。请先运行提取脚本:<br><code>python3 wiki/tools/_extract_questions.py</code></div>`;
      return;
    }
    DATA_READY = true;
    if (restoreSession()) {
      render();
    } else {
      // 记录上次访问的书
      const lastBook = localStorage.getItem("408-quiz-last-book");
      if (lastBook && getBooks().includes(lastBook)) CURRENT.book = lastBook;
      else CURRENT.book = getBooks()[0];
      setBook(CURRENT.book);
    }
  })
  .catch(err => {
    $("#quiz-area").innerHTML = `<div class="empty">加载 data.json 失败: ${escHtml(err.message)}<br><br>请确认:<br>1. data.json 与 index.html 在同一目录<br>2. 或起本地服务器: <code>python3 -m http.server 8767</code> 后访问 <code>http://127.0.0.1:8767/</code></div>`;
  });
</script>
</body>
