<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>408 考研刷题库</title>
<!-- KaTeX(公式渲染;无网时自动回退为原文,不影响刷题) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f0e8d4;
  --bg-deep: #e6dcc3;
  --panel: #fbf5e6;
  --paper: var(--panel);
  --panel-2: #f4ecd8;
  --panel-toolbar: #f5edd9;
  --border: rgba(21, 20, 15, 0.10);
  --border-strong: rgba(21, 20, 15, 0.20);
  --border-soft: rgba(21, 20, 15, 0.06);
  --text: #15140f;
  --text-2: rgba(21, 20, 15, 0.7);
  --muted: rgba(21, 20, 15, 0.5);
  --primary: #df6a58;
  --accent: var(--ink);
  --primary-hover: #c95745;
  --primary-ink: #f7f1de;
  --primary-tint: rgba(223, 106, 88, 0.12);
  --primary-tint-soft: rgba(223, 106, 88, 0.06);
  --ink: #15140f;
  --ink-tint: rgba(21, 20, 15, 0.045);
  --ink-tint-strong: rgba(21, 20, 15, 0.085);
  --ink-soft: rgba(21, 20, 15, 0.10);
  --success: #6e7448;
  --success-light: #e9ead8;
  --success-ink: #2f3318;
  --success-tint: rgba(110, 116, 72, 0.18);
  --error: #a8473a;
  --error-light: #f0ddd5;
  --error-ink: #5a251d;
  --error-tint: rgba(168, 71, 58, 0.18);
  --warning: #c98a2b;
  --warning-light: #f2e4c2;
  --shell-dark: #211f1a;
  --shell-dark-2: #2b2923;
  --shell-dark-3: #36332c;
  --on-shell: #efe7d2;
  --on-shell-muted: rgba(239, 231, 210, 0.55);
  --on-shell-border: rgba(239, 231, 210, 0.15);
  --font-display: "Playfair Display", "Source Serif Pro", "Iowan Old Style", "Charter", Georgia, "Songti SC", "STSong", serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", ui-monospace, Menlo, monospace;
  /* 纸面卡:减糊影,加 1px 内描边和柔光,贴纸感 */
  --shadow: 0 1px 0 rgba(21, 20, 15, 0.025), 0 2px 6px -3px rgba(21, 20, 15, 0.08), 0 18px 36px -32px rgba(21, 20, 15, 0.22);
  --shadow-md: 0 12px 28px -22px rgba(21, 20, 15, 0.28);
  --shadow-toolbar: 0 1px 0 rgba(21, 20, 15, 0.025), 0 6px 14px -10px rgba(21, 20, 15, 0.16);
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { min-height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  padding: 24px 20px 48px;
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Paper noise — subtle texture overlay */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: 0.07;
  mix-blend-mode: multiply;
}
/* 纸面空间:中上方柔光 + 右下角暗角,让卡片有"立着"的感觉 */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255, 255, 255, 0.28), transparent 65%),
    radial-gradient(ellipse 90% 60% at 100% 100%, rgba(21, 20, 15, 0.05), transparent 60%);
}

.app { max-width: 1480px; margin: 0 auto; position: relative; z-index: 1; }

/* === Brand / header (poster-style) === */
.header {
  display: grid;
  grid-template-columns: auto minmax(240px, 1fr) auto;
  align-items: end;
  column-gap: 28px;
  row-gap: 8px;
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px dashed var(--border-strong);
  position: relative;
}
.header-brand {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.header::after {
  content: "●";
  position: absolute; right: 0; bottom: -10px;
  color: var(--primary);
  font-size: 10px;
  background: var(--bg);
  padding: 0 4px;
}
.header h1 {
  font-size: 26px; font-weight: 400;
  font-family: var(--font-display);
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 14px;
}
.header h1 .brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px;
  border: 1.5px solid var(--primary);
  border-radius: 50%;
  color: var(--primary);
  font-style: italic;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
  line-height: 1;
}
.header h1 .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.header h1 .brand-name { font-weight: 600; color: var(--text); }
.header h1 .brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--muted);
  margin-top: 4px;
}

.header-stats {
  display: flex;
  align-items: stretch;
  gap: 0;
  font-size: 10px;
  color: var(--muted);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  justify-self: end;
}
.header-stats > span {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  padding: 0 14px;
  border-left: 1px dashed var(--border);
}
.header-stats > span:first-child { border-left: none; padding-left: 0; }
.header-stats > span:last-child  { padding-right: 0; }
.header-stats strong {
  display: block;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 20px; font-weight: 500;
  letter-spacing: -0.02em;
  margin-bottom: 3px;
  text-transform: none;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

/* === Panel (bone card) === */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.55);
  padding: 20px 22px;
  margin-bottom: 16px;
  position: relative;
}

/* === Control panel: collapse toggle === */
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px dashed var(--border-strong);
  gap: 14px;
}
.panel-head-label {
  display: inline-flex; align-items: baseline; gap: 10px;
  color: var(--text);
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.panel-head-zh {
  font-family: 'Playfair Display', 'Iowan Old Style', Georgia, serif;
  font-style: italic;
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.panel-head-en {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-2);
  transform: translateY(-4px);
}
.panel-head-label::before {
  content: ""; display: inline-block;
  width: 24px; height: 2px; background: var(--primary);
  align-self: center; flex: 0 0 auto;
  transform: translateY(-2px);
  margin-right: 2px;
}
.panel-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.12em;
  cursor: pointer;
  transition: all 0.15s ease;
}
.panel-toggle:hover { color: var(--ink); border-color: var(--border-strong); background: var(--ink-tint); }
.panel-toggle svg { width: 11px; height: 11px; transition: transform 0.2s ease; }
.panel-toggle.is-collapsed svg { transform: rotate(180deg); }

/* === Layout: sidebar + main === */
.layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.sidebar {
  width: 232px;
  flex-shrink: 0;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: none;  /* 完全隐藏滚动条 */
}
/* Sidebar 内部 panel 收紧:head 不再塞 NAVIGATE / gap 收紧 / padding 收窄,
   因为 sidebar 只有 232px,横向预算吃紧 */
.sidebar .panel {
  padding: 16px 14px;
  /* 比主 panel 略厚一点,有 inset shadow,像夹在题册里的硬书签 */
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 0 0 1px rgba(21, 20, 15, 0.02);
}
.sidebar .panel-head { gap: 6px; margin-bottom: 12px; padding-bottom: 12px; }
.sidebar .panel-head-en { display: none; }
.sidebar .panel-toggle { padding: 3px 8px; font-size: 10px; }
.sidebar::-webkit-scrollbar { display: none; }
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: row;
  gap: 20px;
  align-items: flex-start;
}
/* 主区左侧栈:问题卡 + 备份栏 上下堆 */
.quiz-stack {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
/* === AI rail (right side panel) === */
.ai-rail {
  width: 360px;
  flex-shrink: 0;
  position: sticky;
  top: 16px;
  display: flex;
  flex-direction: column;
  align-self: flex-start;  /* 内容尺寸,跟左侧列脱钩,切题不缩放 */
  scrollbar-width: none;
}
.ai-rail::-webkit-scrollbar { display: none; }
/* 折叠到右侧 12px 把手(默认展开,通过 × 切换) */
.ai-rail.is-collapsed {
  width: 12px;
  overflow: hidden;
  cursor: pointer;
}
.ai-rail.is-collapsed .ai-shell { display: none; }
.ai-rail.is-collapsed::after {
  content: "AI 讲题 · 拉起";
  position: sticky;
  top: 80px;
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  writing-mode: vertical-rl;
  color: var(--muted);
  padding: 12px 0;
  text-align: center;
}
.ai-rail.is-collapsed:hover::after { color: var(--ink); }
/* === Sidebar group sections === */
.side-group {
  border-top: 1px dashed var(--border);
  padding: 4px 0 2px;
}
.side-group:first-child { border-top: none; padding-top: 2px; }
.side-group-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.side-group-label::before {
  content: "";
  width: 12px;
  height: 1.5px;
  background: var(--ink);
  flex-shrink: 0;
}
.side-chapter {
  padding: 4px 12px 8px;
}
.side-chapter select {
  width: 100%;
  min-width: 0;
  padding: 7px 26px 7px 10px;
  font-size: 13px;
  font-family: 'Inter Tight', 'PingFang SC', system-ui, sans-serif;
  font-weight: 500;
  color: var(--text);
  background-color: var(--panel);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0 L4 5 L8 0' fill='none' stroke='%23ed6f5c' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  border: 1px solid var(--border);
  border-radius: 4px;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
.side-chapter select:hover { border-color: var(--primary); }
.side-chapter select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(237, 111, 92, 0.15); }

/* === Book entries (vertical light rows / bookmark feel) === */
.book-tabs {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 0;
}
.book-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px 9px 16px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  letter-spacing: 0.01em;
  transition: background 0.12s, color 0.12s, transform 0.15s, border-color 0.15s;
  text-align: left;
  position: relative;
  width: 100%;
}
.book-entry::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 0;
  background: var(--ink);
  border-radius: 1px;
  transition: height 0.18s ease, background 0.18s ease;
}
.book-entry:hover {
  background: var(--ink-tint);
  border-color: var(--border);
  color: var(--text);
  transform: translateX(2px);
}
.book-entry:hover::before { height: 55%; }
.book-entry.active {
  background: var(--ink-tint-strong);
  border-color: var(--border);
  color: var(--text);
  font-weight: 600;
  /* 极淡的折角/纸签感,右上小三角 */
  overflow: hidden;
}
.book-entry.active::before { height: 70%; background: var(--ink); width: 3px; }
.book-entry.active::after {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 0 8px 8px 0;
  border-color: transparent var(--primary) transparent transparent;
  opacity: 0.85;
}
.book-entry .be-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-entry .be-count {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 400;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}
.book-entry.active .be-count { color: var(--text-2); }
.book-entry .be-mini {
  display: inline-flex;
  gap: 6px;
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
.book-entry .be-mini span:empty { display: none; }

/* === Controls row inside sidebar === */
.controls-row {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
  border-top: 1px dashed var(--border);
}
.controls-row select, .controls-row .mode-btn {
  width: 100%;
  text-align: left;
  border-radius: 6px;
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter Tight', 'PingFang SC', system-ui, sans-serif;
  background-color: transparent;
  color: var(--text-2);
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
/* 真下拉(select)才保留右侧箭头 + 30px padding 给箭头让位 */
.controls-row select {
  padding: 9px 30px 9px 14px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0 L4 5 L8 0' fill='none' stroke='%23ed6f5c' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
}
/* 即时判分 / 刷新题库 按钮(不是下拉)不需要箭头 */
.controls-row .mode-btn {
  padding: 9px 14px;
}
.controls-row select:hover, .controls-row .mode-btn:hover {
  background-color: var(--ink-tint);
  border-color: var(--border);
  color: var(--text);
}
.controls-row select:focus { outline: none; color: var(--text); }

/* option 列表也用纸面色(浏览器原生是白底) */
.side-chapter option, .controls-row option {
  background: var(--panel);
  color: var(--text);
}
.controls-row .mode-btn.active {
  background: var(--ink-tint);
  color: var(--text);
  font-weight: 600;
}

/* === Mode tabs (vertical rows in sidebar) === */
.mode-tabs {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
}
.mode-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 9px 14px 9px 16px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter Tight', 'PingFang SC', system-ui, sans-serif;
  cursor: pointer;
  position: relative;
  /* 左侧强调条:默认 0 高度,激活态拉到 60% */
  box-shadow: inset 0 0 0 0 transparent;
  transition: background 0.15s, color 0.15s, box-shadow 0.18s ease, transform 0.12s;
  text-align: left;
}
.mode-btn:hover {
  background: var(--ink-tint);
  border-color: var(--border);
  color: var(--text);
  box-shadow: inset 2px 0 0 var(--ink-soft);
}
.mode-btn.active {
  background: linear-gradient(90deg, rgba(21, 20, 15, 0.075) 0%, rgba(21, 20, 15, 0.025) 70%);
  border-color: var(--border);
  color: var(--text);
  font-weight: 600;
  box-shadow: inset 3px 0 0 var(--ink);
}
.mode-btn.active:hover {
  background: linear-gradient(90deg, rgba(21, 20, 15, 0.10) 0%, rgba(21, 20, 15, 0.04) 70%);
}
/* 视觉分组:顺序/随机是刷题顺序,错题/收藏/未做是筛选
   在错题按钮上方加一条细分隔线,做视觉切分 */
.mode-btn[data-mode="wrong"] {
  margin-top: 6px;
  padding-top: 14px;  /* 给分隔线让位 */
}
.mode-btn[data-mode="wrong"]::before {
  content: "";
  position: absolute;
  left: 12px; right: 12px;
  top: 0;
  height: 1px;
  background: var(--border);
}
.mode-btn[data-mode="favorite"] { margin-top: 2px; }
.mode-btn[data-mode="unattempted"] { margin-top: 2px; }
.mode-btn .badge {
  display: inline-flex;
  align-items: center;
  margin-left: 0;
  padding: 1px 7px;
  background: rgba(21, 20, 15, 0.07);
  color: var(--text-2);
  border-radius: 999px;
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 500;
  flex-shrink: 0;
  letter-spacing: 0.02em;
  transition: background 0.15s, color 0.15s;
}
.mode-btn:hover .badge { background: rgba(21, 20, 15, 0.10); }
.mode-btn.active .badge {
  background: var(--ink);
  color: var(--primary-ink);
  font-weight: 600;
}
.mode-btn-danger {
  color: var(--error);
}
.mode-btn-danger:hover { background: var(--error-light); color: var(--error); }
.mode-btn-danger svg { flex-shrink: 0; }

/* === Responsive: ≤1024px 桌面 → AI 抽屉 === */
@media (max-width: 1024px) {
  .main { flex-direction: column; }
  .quiz-stack { width: 100%; }
  .ai-rail {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    top: auto;
    width: auto;
    max-height: 65vh;
    z-index: 50;
    transform: translateY(calc(100% - 44px));
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .ai-rail.is-open { transform: translateY(0); }
  .ai-rail::before {
    content: "AI 讲题 · 拉起 ⬆";
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    margin: -13px -16px 12px;  /* 抵消 ai-head 的 padding,把手贴边 */
    background: linear-gradient(180deg, var(--shell-dark-2), var(--shell-dark));
    color: var(--on-shell);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    border-bottom: 1px dashed var(--on-shell-border);
    cursor: pointer;
  }
  .ai-rail.is-open::before { content: "AI 讲题 · 收起 ⬇"; }
  /* 折叠态在抽屉模式下不适用(抽屉自带半收逻辑),重置 */
  .ai-rail.is-collapsed { width: auto; overflow: visible; cursor: default; }
  .ai-rail.is-collapsed .ai-shell { display: block; }
  .ai-rail.is-collapsed::after { display: none; }
  /* study-tools 留出底部抽屉空间,避免被挡 */
  .study-tools { margin-bottom: 80px; }
}

/* === Responsive: stack at narrow widths === */
@media (max-width: 760px) {
  .layout { flex-direction: column; gap: 12px; }
  .sidebar {
    width: 100%;
    position: static;
    max-height: none;
  }
  .book-tabs {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
  }
  .book-entry {
    flex: 1 1 calc(50% - 3px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
  }
  .book-entry::before { display: none; }
  .mode-tabs { flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .mode-btn {
    flex: 1 1 calc(50% - 3px);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
}

/* === Question area === */
#quiz-area.panel {
  padding: 22px 24px;
}
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted);
  margin-bottom: 18px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--border);
  gap: 12px;
}
.q-meta .q-pos {
  font-weight: 600;
  color: var(--text);
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  text-transform: none;
  letter-spacing: 0.02em;
  font-size: 13px;
  font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
.q-meta .q-pos strong {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.005em;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.q-meta .q-pos::before {
  content: "";
  display: inline-block;
  width: 20px; height: 1.5px;
  background: var(--primary);
  align-self: center;
  flex-shrink: 0;
}
.q-meta .q-pos .q-pos-total {
  font-family: 'Inter Tight', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.q-meta .q-source {
  color: var(--text-2);
  font-size: 11px;
  text-transform: none;
  letter-spacing: 0.04em;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'Inter Tight', 'PingFang SC', system-ui, sans-serif;
}
.q-meta .img-toggle {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 5px;
  margin-left: 12px;
  padding: 3px 9px;
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  font-weight: 500;
}
.q-meta .img-toggle:hover {
  border-color: var(--ink);
  color: var(--ink);
}
.q-meta .img-toggle.is-off {
  color: var(--muted);
  border-color: var(--border);
  background: rgba(21, 20, 15, 0.03);
}
.q-meta .img-toggle.is-off:hover {
  border-color: var(--ink);
  color: var(--ink);
  background: transparent;
}
.q-meta .img-toggle svg {
  width: 12px; height: 12px;
  stroke: currentColor; fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.q-stem.imgs-hidden img { display: none; }

.q-stem {
  font-size: 17px;
  font-weight: 400;
  max-width: 78ch;
  margin: 0 0 24px;
  padding: 6px 0 6px 20px;
  border-left: 2px solid var(--ink);
  white-space: pre-wrap;
  line-height: 1.8;
  color: var(--text);
  transition: border-color 0.18s, background-color 0.18s;
}
/* 答题反馈闪光:题面左线 + 题卡本体同时给视觉信号,克制不破坏纸面感 */
.q-stem.flash-correct {
  border-left-color: var(--success);
  background: linear-gradient(90deg, var(--success-light) 0%, transparent 65%);
}
.q-stem.flash-wrong {
  border-left-color: var(--error);
  background: linear-gradient(90deg, var(--error-light) 0%, transparent 65%);
}
.q-stem.flash-info {
  border-left-color: var(--ink);
  background: linear-gradient(90deg, var(--ink-tint) 0%, transparent 65%);
}
#quiz-area { transition: box-shadow 0.18s ease-out; }
#quiz-area.bloom { animation: qcard-bloom 0.55s ease-out; }
@keyframes qcard-bloom {
  0%   { box-shadow: 0 0 0 0 rgba(110, 116, 72, 0.30); }
  60%  { box-shadow: 0 0 0 10px rgba(110, 116, 72, 0.10); }
  100% { box-shadow: 0 0 0 0 rgba(110, 116, 72, 0); }
}
@media (prefers-reduced-motion: reduce) {
  #quiz-area.bloom { animation: none; }
}
/* 题面 / 解析 / 选项里的围栏代码块(纸面装订框) */
.q-stem pre.q-code, .opt-text pre.q-code, .fb-expl pre.q-code {
  background: var(--paper);
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 10px 12px 10px 14px;
  margin: 10px 0;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text);
  overflow-x: auto;
  /* 配合 <wbr>: 长代码在容器宽度内自然折行,短代码保持一行 */
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  position: relative;
}
/* 有 data-lang 时给语言标签让出顶部 26px,避免跟代码挤一起 */
.q-stem pre.q-code[data-lang], .opt-text pre.q-code[data-lang], .fb-expl pre.q-code[data-lang] {
  padding-top: 30px;
}
.q-stem pre.q-code::before, .opt-text pre.q-code::before, .fb-expl pre.q-code::before {
  content: "";
  position: absolute;
  top: 8px; left: 8px;
  width: 6px; height: 6px;
  background: var(--ink);
  box-shadow:
    0 0 0 1px var(--paper),
    10px 0 0 var(--ink),
    10px 0 0 1px var(--paper),
    20px 0 0 var(--ink),
    20px 0 0 1px var(--paper);
  opacity: 0.7;
}
.q-stem pre.q-code[data-lang]::after, .opt-text pre.q-code[data-lang]::after, .fb-expl pre.q-code[data-lang]::after {
  content: attr(data-lang);
  position: absolute;
  top: 6px; right: 10px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--bg);
  padding: 1px 6px;
  border-radius: 3px;
}
.q-stem pre.q-code code, .opt-text pre.q-code code, .fb-expl pre.q-code code {
  background: transparent;
  border: 0;
  padding: 0;
  font-family: inherit;
  color: inherit;
  font-size: inherit;
}

/* === Options === */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.option {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 13px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  background: rgba(255, 255, 255, 0.20);
  font-size: 15px;
  position: relative;
  min-height: 50px;
  color: var(--text);
  /* 给选项纸面感:一道浅 ink tint 兜底,跟 panel 区分开但仍贴脸 */
}
.option:hover:not(.disabled):not(.selected):not(.correct):not(.wrong) {
  /* 改用纯边框色变化,不再 translateY 引起周围抖动
     排除已选/对/错 — 避免悬停覆盖 selected/批分后的深色 */
  border-color: rgba(21, 20, 15, 0.32);
  background: rgba(255, 255, 255, 0.32);
}
.option.selected {
  border-color: rgba(21, 20, 15, 0.42);
  background: rgba(21, 20, 15, 0.045);
  box-shadow: inset 0 0 0 1px rgba(21, 20, 15, 0.08);
}
.option.correct {
  border-color: rgba(110, 116, 72, 0.45);
  background: var(--success-light);
  color: var(--success-ink);
}
.option.wrong {
  border-color: rgba(168, 71, 58, 0.45);
  background: var(--error-light);
  color: var(--error-ink);
}
.option.disabled { cursor: not-allowed; }
.option .opt-letter {
  width: 26px; height: 26px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
  font-family: var(--font-display);
  font-style: italic;
  color: var(--text-2);
  background: var(--paper);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  line-height: 1;
}
.option:hover:not(.disabled):not(.selected):not(.correct):not(.wrong) .opt-letter {
  color: var(--text);
  border-color: var(--ink-soft);
}
.option.selected .opt-letter {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--primary-ink);
}
.option.correct .opt-letter {
  background: var(--success);
  border-color: var(--success);
  color: var(--paper);
}
.option.wrong .opt-letter {
  background: var(--error);
  border-color: var(--error);
  color: var(--paper);
}
.option .opt-text { flex: 1; white-space: pre-wrap; padding-top: 2px; line-height: 1.65; }

/* === Question images === */
.q-img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  cursor: zoom-in;
}
.q-img-missing {
  display: inline-block;
  padding: 4px 10px;
  margin: 8px 0;
  background: var(--warning-light);
  color: #6e4715;
  border: 1px dashed var(--warning);
  border-radius: var(--radius);
  font-size: 12px;
}
.q-img-zoom {
  position: fixed; inset: 0;
  background: rgba(21, 20, 15, 0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; cursor: zoom-out; padding: 20px;
}
.q-img-zoom img { max-width: 96vw; max-height: 92vh; object-fit: contain; background: white; border-radius: 2px; }

/* Tables inside questions */
.q-stem table, .opt-text table, .fb-expl table {
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 14px;
}
.q-stem table td, .q-stem table th,
.opt-text table td, .opt-text table th,
.fb-expl table td, .fb-expl table th {
  border: 1px solid var(--border-strong);
  padding: 5px 12px;
  text-align: center;
}

/* KaTeX */
.katex { font-size: 1.05em; }
.katex-display { margin: 10px 0 !important; }

/* === Action buttons === */
.actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 0;
  align-items: center;
  padding: 16px 0 4px;
  border-top: 1px dashed var(--border);
}
.actions-secondary {
  margin-top: 4px;
  border-top: none;
  padding-top: 0;
}
.action-spacer { margin-left: auto; }
.action-hint {
  color: var(--muted);
  font-size: 11.5px;
  align-self: center;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-2);
  background: rgba(21, 20, 15, 0.03);
}
.status-pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink);
}
.status-pill.correct {
  border-color: var(--success);
  color: var(--success-ink);
  background: var(--success-light);
}
.status-pill.correct::before { background: var(--success); }
.status-pill.wrong {
  border-color: var(--error);
  color: var(--error-ink);
  background: var(--error-light);
}
.status-pill.wrong::before { background: var(--error); }
.btn {
  padding: 8px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--ink-tint);
  color: var(--ink);
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary {
  background: var(--ink);
  color: var(--primary-ink);
  border-color: var(--ink);
  font-weight: 600;
  padding: 9px 20px;
  box-shadow: 0 1px 0 rgba(21, 20, 15, 0.04);
}
.btn-primary:hover:not(:disabled) {
  background: var(--text);
  border-color: var(--text);
  color: var(--primary-ink);
}
/* 提交 + 下一题 仍用 primary,但用 primary 里的"accent 提色" 提示这是主操作 */
.btn-primary.btn-accent {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
}
.btn-primary.btn-accent:hover:not(:disabled) {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}
.btn-secondary {
  background: rgba(21, 20, 15, 0.04);
  color: var(--text);
  border-color: var(--border-strong);
  font-weight: 600;
  padding: 8px 16px;
}
.btn-secondary:hover:not(:disabled) {
  background: var(--ink-tint-strong);
  border-color: var(--ink-soft);
  color: var(--ink);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-2);
  padding: 8px 12px;
  font-weight: 500;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--ink-tint);
  border-color: transparent;
  color: var(--ink);
}
.btn-fav {
  color: var(--warning);
  border-color: var(--warning-light);
  background: rgba(201, 138, 43, 0.04);
}
.btn-fav:hover:not(:disabled) {
  border-color: var(--warning);
  background: rgba(201, 138, 43, 0.10);
}
.btn-fav.active {
  background: var(--warning);
  color: var(--paper);
  border-color: var(--warning);
  font-weight: 600;
}
.btn.is-loading { opacity: 0.7; pointer-events: none; }

/* === Feedback === */
.feedback {
  padding: 16px 18px;
  border-radius: var(--radius);
  margin: 8px 0 22px;
  font-size: 14px;
  display: none;
  border: 1px solid;
  background: var(--panel);
}
.feedback.show {
  display: block;
}
.feedback.correct {
  background: var(--success-light);
  color: var(--success-ink);
  border-color: var(--success);
  border-left-width: 3px;
}
.feedback.wrong {
  background: var(--error-light);
  color: var(--error-ink);
  border-color: var(--error);
  border-left-width: 3px;
}
.feedback.info {
  background: var(--ink-tint);
  color: var(--text);
  border-color: var(--ink);
  border-left-width: 3px;
}
.feedback .fb-head {
  font-weight: 600;
  margin-bottom: 6px;
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: -0.01em;
}
.feedback .fb-answer { color: inherit; opacity: 0.92; }
.feedback .fb-expl {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed rgba(21, 20, 15, 0.18);
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.72;
}

.study-tools {
  padding: 12px 18px;
  background: var(--panel-toolbar);
  box-shadow: var(--shadow-toolbar), inset 0 1px 0 rgba(255, 255, 255, 0.55);
}
.backup-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
}
.backup-note {
  margin-right: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.backup-note::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px rgba(110, 116, 72, 0.18);
}
.backup-btn {
  padding: 5px 11px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s ease;
}
.backup-btn:hover {
  border-color: var(--ink-soft);
  color: var(--ink);
  background: var(--ink-tint);
}
/* === AI helper (dark console panel) === */
.ai-shell {
  border: 1px solid rgba(239, 231, 210, 0.10);
  background: var(--shell-dark);
  color: var(--on-shell);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 14px 36px -28px rgba(21, 20, 15, 0.55);
  display: flex;
  flex-direction: column;
}

/* 反馈卡 / AI 面板 弹出动画已关闭(用户偏好直接显隐) */
.ai-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 16px;
  background: linear-gradient(180deg, var(--shell-dark-2), var(--shell-dark));
  border-bottom: 1px dashed var(--on-shell-border);
}
.ai-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--on-shell);
  font-weight: 600;
  letter-spacing: -0.005em;
  min-width: 0;
  flex: 1;
}
.ai-title::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: none;
  flex-shrink: 0;
}
.ai-title-main {
  white-space: nowrap;
  flex-shrink: 0;
}
.ai-title small {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--on-shell-muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
.ai-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--on-shell-border);
  background: transparent;
  color: var(--on-shell-muted);
  cursor: pointer;
}
.ai-head-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-gear {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--on-shell-border);
  background: transparent;
  color: var(--on-shell-muted);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}
.ai-gear.active {
  background: var(--primary);
  color: var(--primary-ink);
  border-color: var(--primary);
}
.ai-cfg {
  padding: 12px 14px;
  border-bottom: 1px dashed var(--on-shell-border);
  background: var(--shell-dark-2);
}
.ai-cfg[hidden] { display: none; }
.ai-cfg-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.ai-cfg-row + .ai-cfg-row { margin-top: 8px; }
.ai-cfg-row label {
  flex: 1 1 140px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font: 10px/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on-shell-muted);
}
.ai-cfg-row input,
.ai-cfg-row select {
  border: 1px solid var(--on-shell-border);
  border-radius: 8px;
  background: var(--paper);
  color: var(--text);
  padding: 7px 10px;
  font: 12px/1.3 var(--font-mono);
  width: 100%;
  min-width: 0;
}
.ai-cfg-row input:focus,
.ai-cfg-row select:focus { outline: 2px solid var(--primary-tint); outline-offset: 1px; border-color: var(--primary); }
.ai-cfg-actions { align-items: center; }
.ai-cfg-hint {
  font: 11px/1.55 var(--font-mono);
  color: var(--on-shell-muted);
  letter-spacing: 0.04em;
}
.ai-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
}
/* AI 输出区域容器:内容尺寸,被 max-height 封顶,内容超长才滚动
   用户要求"只有 AI 输出时候才需要长大"——空态就只是装饰文案,不要撑满 */
.ai-output-area {
  flex: 0 0 auto;
  min-height: 120px;
  max-height: 360px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: none;
}
.ai-output-area::-webkit-scrollbar { display: none; }
.ai-context {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 9px 12px;
  margin-bottom: 12px;
  background: var(--shell-dark-2);
  border: 1px dashed var(--on-shell-border);
  border-radius: 8px;
}
.ai-context-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.ai-context-row-source { color: var(--on-shell); }
.ai-context-row-state {
  justify-content: space-between;
  color: var(--on-shell-muted);
  font-size: 10.5px;
}
.ai-context-rule {
  display: inline-block;
  width: 3px;
  height: 16px;
  background: var(--primary);
  border-radius: 1px;
  flex-shrink: 0;
}
.ai-context-icon {
  width: 14px;
  height: 14px;
  color: var(--on-shell-muted);
  flex-shrink: 0;
}
.ai-context-source {
  font: 11px/1.3 var(--font-mono);
  color: var(--on-shell);
  letter-spacing: 0.04em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ai-context-dot {
  color: var(--on-shell-muted);
  flex-shrink: 0;
  font: 11px/1 var(--font-mono);
}
.ai-context-state {
  font: 10px/1 var(--font-mono);
  color: var(--on-shell-muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}
.ai-copy-inline {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px 5px 8px;
  border: 1px solid var(--on-shell-border);
  border-radius: 999px;
  background: transparent;
  color: var(--on-shell);
  font: 10px/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  flex-shrink: 0;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
.ai-copy-inline svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.ai-copy-inline:hover {
  background: var(--primary);
  color: var(--primary-ink);
  border-color: var(--primary);
}
.ai-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.ai-output {
  min-height: 100px;
  flex: 0 0 auto;
  padding: 16px 18px;
  border: 1px dashed var(--on-shell-border);
  border-radius: calc(var(--radius) - 4px);
  background: var(--shell-dark-2);
  color: var(--on-shell);
  font-size: 13.5px;
  line-height: 1.78;
  word-break: break-word;
}
/* === AI 栏空态:装饰性金句/提示 === */
.ai-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 240px;
  text-align: center;
  padding: 24px 20px;
  -webkit-user-select: none;
  user-select: none;
}
.ai-empty-mark {
  font-family: var(--font-display);
  font-size: 32px;
  font-style: italic;
  color: var(--on-shell-muted);
  opacity: 0.35;
  letter-spacing: 0.2em;
  margin-bottom: 18px;
  line-height: 1;
}
.ai-empty-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--on-shell);
  max-width: 280px;
  letter-spacing: 0.01em;
}
.ai-empty-author {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--on-shell-muted);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin-top: 8px;
  opacity: 0.75;
}
.ai-empty-rule {
  width: 28px;
  height: 1px;
  background: var(--on-shell-border);
  margin: 20px 0 14px;
}
.ai-empty-hint {
  font: 10.5px/1.5 var(--font-mono);
  color: var(--on-shell-muted);
  letter-spacing: 0.06em;
  opacity: 0.7;
  max-width: 240px;
}
.ai-output > :first-child { margin-top: 0; }
.ai-output > :last-child  { margin-bottom: 0; }
.ai-output.is-streaming > :last-child::after {
  content: "";
  display: inline-block;
  width: 7px;
  height: 1em;
  margin-left: 2px;
  vertical-align: text-bottom;
  background: rgba(239, 231, 210, 0.5);
  animation: aiCursor 1s steps(2, end) infinite;
}
@keyframes aiCursor { 50% { opacity: 0; } }
.ai-output p  { margin: 8px 0; }
.ai-output h1,
.ai-output h2,
.ai-output h3,
.ai-output h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 14px 0 8px;
  line-height: 1.3;
  color: var(--on-shell);
}
.ai-output h1 { font-size: 18px; }
.ai-output h2 { font-size: 16px; padding-bottom: 4px; border-bottom: 1px dashed var(--on-shell-border); }
.ai-output h3 { font-size: 14.5px; }
.ai-output h4 { font-size: 13px; color: var(--on-shell-muted); }
.ai-output ul,
.ai-output ol { margin: 8px 0; padding-left: 24px; }
.ai-output li { margin: 3px 0; }
.ai-output li > p { margin: 2px 0; }
.ai-output code {
  font: 12px/1.5 var(--font-mono);
  padding: 1px 6px;
  background: var(--shell-dark-3);
  border: 1px solid var(--on-shell-border);
  border-radius: 3px;
  color: var(--on-shell);
}
.ai-output pre {
  position: relative;
  margin: 10px 0;
  padding: 14px 14px 12px 16px;
  background: var(--paper);
  border: 1px dashed var(--border);
  border-radius: 8px;
  overflow-x: auto;
  font: 12.5px/1.7 var(--font-mono);
  color: var(--text);
  white-space: pre;
  tab-size: 2;
}
.ai-output pre::before {
  content: "";
  position: absolute;
  top: 10px;
  left: 10px;
  width: 6px;
  height: 6px;
  background: var(--ink);
  border-radius: 1px;
  box-shadow: 10px 0 0 var(--ink), 0 8px 0 0 var(--ink), 10px 8px 0 0 var(--ink);
  opacity: 0.85;
}
.ai-output pre code { background: none; padding: 0; color: inherit; font: inherit; }
.ai-output pre[data-lang]::after {
  content: attr(data-lang);
  position: absolute;
  top: 6px;
  right: 10px;
  font: 9.5px/1 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--bg);
  padding: 3px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
}
.ai-output pre[data-lang] { padding-right: 12px; }
/* 语法高亮 token — 沿用 Atelier Zero 配色: 珊瑚(关键字) / 橄榄(字符串) / 墨黑(常规) / 灰(注释/运算符) */
.tok-kw  { color: var(--ink); font-weight: 600; }
.tok-str { color: #6e7448; }                    /* 橄榄,沿用 --success 同色 */
.tok-num { color: #b37d3d; font-weight: 600; }  /* 暖棕数字 — 跟纸面协调,跟正文拉开 */
.tok-bool{ color: var(--ink); font-weight: 600; }
.tok-com { color: var(--muted); font-style: italic; }
.tok-fn  { color: var(--text); }
.tok-op  { color: var(--muted); }
.tok-type{ color: #a8473a; }                    /* 深珊瑚,函数返回类型/类名 */
.ai-output blockquote {
  margin: 8px 0;
  padding: 4px 0 4px 12px;
  border-left: 3px solid var(--primary);
  color: var(--on-shell-muted);
  font-style: italic;
}
.ai-output hr {
  border: 0;
  border-top: 1px dashed var(--on-shell-border);
  margin: 12px 0;
}
.ai-output a {
  color: var(--primary);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.ai-output strong { color: var(--on-shell); font-weight: 600; }
.ai-output em { font-style: italic; }
/* 流式光标:行末珊瑚竖线 1s 步进闪烁,沿用题卡题干左线同色 */
.ai-output .ai-cursor {
  display: inline-block;
  color: var(--primary);
  font-weight: 600;
  margin-left: 1px;
  animation: ai-blink 1s steps(2, start) infinite;
}
@keyframes ai-blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  .ai-output .ai-cursor { animation: none; }
}
.ai-input-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--on-shell-border);
}
.ai-input-row input {
  flex: 1;
  min-width: 0;
  border: 1px dashed var(--on-shell-border);
  border-radius: 8px;
  background: var(--shell-dark-2);
  color: var(--on-shell);
  padding: 8px 12px;
  font: 12.5px/1.4 var(--font-mono);
}
.ai-input-row input::placeholder { color: var(--on-shell-muted); }
.ai-input-row input:focus {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
  border-color: var(--primary);
  border-style: solid;
}
/* 询问 AI 按钮:在深色面板里用珊瑚色跳出来,比默认 ink 按钮轻盈 */
.ai-input-row .btn {
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 8px;
}
.ai-input-row .btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
  box-shadow: none;
}
.ai-input-row .btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
  color: var(--primary-ink);
}

/* AI 栏底部 mini 学习概览条 */
.ai-quick {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--shell-dark-2);
  border: 1px dashed var(--on-shell-border);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--on-shell-muted);
  flex-shrink: 0;
}
.ai-quick-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.ai-quick-item {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  white-space: nowrap;
  color: var(--on-shell-muted);
}
.ai-quick-item strong {
  color: var(--on-shell);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.ai-quick-item.ai-quick-acc strong { color: var(--success); }
.ai-quick-item.ai-quick-wrong strong { color: var(--error); }
.ai-quick-sep {
  color: var(--on-shell-border);
  font-size: 12px;
  flex-shrink: 0;
}
.ai-quick-bar {
  flex: 1;
  height: 3px;
  background: var(--shell-dark-3);
  border-radius: 2px;
  overflow: hidden;
}
.ai-quick-bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-hover));
  transition: width 0.3s ease;
}

/* === Loading / empty === */
.loading, .empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
  font-size: 14px;
}
.empty .btn { margin-top: 12px; }

/* === Toast === */
.toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px;
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 100;
  letter-spacing: 0.02em;
}
.toast.show { opacity: 1; }

/* === Responsive === */
@media (max-width: 600px) {
  body { padding: 14px 12px 32px; }
  .panel { padding: 16px; }
  #quiz-area.panel { padding: 18px 16px; }
  .header {
    grid-template-columns: 1fr;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 14px;
  }
  .header h1 { font-size: 22px; }
  .header h1 .brand-mark { width: 32px; height: 32px; font-size: 18px; }
  .header-stats {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0;
    letter-spacing: 0.1em;
    justify-self: stretch;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }
  .header-stats strong { font-size: 18px; }
  .header-stats > span {
    align-items: flex-start;
    padding: 0 10px;
    border-left: 1px dashed var(--border);
  }
  .header-stats > span:first-child { padding-left: 0; border-left: none; }
  .q-stem { font-size: 15.5px; line-height: 1.78; padding-left: 16px; }
  .option { font-size: 14px; padding: 11px 12px; gap: 10px; }
  .option .opt-letter { width: 24px; height: 24px; font-size: 12px; }
  .controls-row { gap: 6px; align-items: stretch; }
  select { min-width: 0; flex: 1 1 100%; width: 100%; }
  .mode-tabs { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mode-btn { width: 100%; justify-content: center; padding: 9px 10px; }
  .q-meta { flex-direction: column; align-items: flex-start; gap: 6px; }
  .q-meta .q-pos strong { font-size: 19px; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions .btn { justify-content: center; }
  .action-spacer { margin-left: 0; }
  .action-hint { grid-column: 1 / -1; order: 3; }
  .status-pill { grid-column: 1 / -1; justify-content: center; }
  .backup-row { justify-content: stretch; flex-wrap: wrap; }
  .backup-note { width: 100%; margin-right: 0; }
  .backup-btn { flex: 1; }
  .ai-head { align-items: flex-start; }
  .ai-actions, .ai-input-row { flex-direction: column; }
  .ai-input-row .btn { width: 100%; }
  .ai-cfg-row label { flex-basis: 100%; }
}

/* === Label utility (poster-style small caps) === */
.label {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--text-2);
}
.label::before {
  content: "";
  width: 18px; height: 1.5px;
  background: var(--primary);
}

/* === Nav-bar inline quote (sits in the "题库导航" row, between label and toggle) === */
.nav-quote {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text-2);
  margin-left: auto;
  margin-right: 22px;
  max-width: 540px;
  padding: 0 16px;
  border-left: 1.5px solid var(--ink);
  border-right: 1.5px solid var(--ink);
  overflow: hidden;
}
.nav-quote .nq-text {
  color: var(--text);
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}
.nav-quote .nq-author {
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-2);
  flex: 0 0 auto;
  white-space: nowrap;
}
.nav-quote .nq-switches {
  display: flex;
  gap: 4px;
  flex: 0 0 auto;
}
.nav-quote .nq-btn {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  font-style: normal;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.nav-quote .nq-btn:hover {
  background: var(--ink);
  color: #fff;
}
.nav-quote .nq-btn:active {
  transform: scale(0.9);
}
.nav-quote .nq-btn:focus-visible {
  outline: 1.5px solid var(--ink);
  outline-offset: 2px;
}
@media (max-width: 820px) {
  .nav-quote { display: none; }
}
.sidebar .nav-quote { display: none; }

/* === Header inline quote (between brand and stats) === */
.header-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 17px;
  line-height: 1.5;
  color: var(--text-2);
  justify-self: center;
  text-align: center;
  max-width: 540px;
  min-width: 0;
  padding: 0 18px;
  border-left: 1.5px solid var(--primary);
  border-right: 1.5px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-quote .hq-text {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  font-size: 17px;
}
.header-quote .hq-author {
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}
@media (max-width: 1100px) {
  .header-quote { display: none; }
}
</style>

<body>
<div class="app">
  <div class="header">
    <h1 class="header-brand">
      <span class="brand-mark">408</span>
      <span class="brand-text">
        <span class="brand-name">考研刷题库</span>
        <span class="brand-sub">WANGDAO 2026 / LOCAL PRACTICE</span>
      </span>
    </h1>
    <span class="header-quote" id="header-quote"></span>
    <div class="header-stats" id="header-stats"></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel" id="control-panel">
        <div class="panel-head">
          <span class="panel-head-label"><span class="panel-head-zh">题库导航</span><span class="panel-head-en">/ NAVIGATE</span></span>
          <span class="nav-quote" id="nav-quote" aria-hidden="true"></span>
        </div>
        <div class="side-group">
          <div class="side-group-label">书目</div>
          <div class="book-tabs" id="book-tabs"></div>
        </div>
        <div class="side-group">
          <div class="side-group-label">章节</div>
          <div class="side-chapter">
            <select id="chapter-sel" title="选择章节"></select>
          </div>
        </div>
        <div class="side-group">
          <div class="side-group-label">模式</div>
          <div class="mode-tabs" id="mode-tabs"></div>
          <div class="controls-row" id="mode-extras"></div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="quiz-stack">
        <div class="panel" id="quiz-area">
          <div class="loading">加载题库中...</div>
        </div>

        <div class="panel study-tools">
          <div class="backup-row" aria-label="学习记录备份">
            <span class="backup-note">学习记录 / 自动保存</span>
            <button class="backup-btn" type="button" id="export-progress">导出记录</button>
            <button class="backup-btn" type="button" id="import-progress">导入记录</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>
        </div>
      </div>

      <aside class="ai-rail" id="ai-rail" aria-label="AI 讲题"></aside>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

// ============== 数据 ==============
let ALL_QUESTIONS = [];  // 全部题目
let CURRENT = {
  book: null,           // 当前选中的书(null = 全部书)
  chapter: null,        // 当前选中的章节(num), null = 全部
  mode: "sequential",   // sequential | random | wrong | favorite
  instantGrade: false,  // true = 点击选项立即判分
  limit: 50,            // 全部模式下一组题数
  questions: [],        // 当前题单
  idx: 0,               // 当前题号
  answers: {},          // qid -> { selected: [A,B], correct: bool, time: ts }
  aiOpen: false,        // 当前题 AI 助手是否展开(保留兼容,实际由 aiRailCollapsed 控制)
  aiRailCollapsed: false, // 右侧 AI 栏是否被手动折叠
  aiCfgOpen: false,     // AI 配置区是否展开
  aiOutput: "",         // AI 助手当前输出
};

// 答题反馈闪光:记录"上一次触发 flash 的题 id",切到新题/重渲染时不再误触
let LAST_FLASHED_QID = null;
let FLASH_TIMER = null;

// ============== localStorage ==============
const LS_KEY = "408-quiz-v1";
const SESSION_KEY = "408-quiz-session-v1";
let DATA_READY = false;
let RESTORING_SESSION = false;
function loadState() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) return JSON.parse(s);
  } catch (e) { console.warn("LS load error", e); }
  return { wrong: {}, favorite: {}, stats: { answered: 0, correct: 0 }, attempted: {} };
}
function saveState(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); }
  catch (e) { console.warn("LS save error", e); }
}
let STATE = loadState();

function getSessionSnapshot() {
  return {
    book: CURRENT.book,
    chapter: CURRENT.chapter,
    mode: CURRENT.mode,
    instantGrade: CURRENT.instantGrade,
    limit: CURRENT.limit,
    idx: CURRENT.idx,
    answers: CURRENT.answers,
    questionIds: CURRENT.questions.map(q => q.id),
    savedAt: new Date().toISOString()
  };
}

function saveSession() {
  if (!DATA_READY || RESTORING_SESSION) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(getSessionSnapshot()));
  } catch (e) {
    console.warn("Session save error", e);
  }
}

function loadSession() {
  try {
    const s = localStorage.getItem(SESSION_KEY);
    return s ? JSON.parse(s) : null;
  } catch (e) {
    console.warn("Session load error", e);
    return null;
  }
}

function restoreSession() {
  const session = loadSession();
  if (!session || !ALL_QUESTIONS.length) return false;
  const books = getBooks();
  RESTORING_SESSION = true;
  try {
    CURRENT.book = session.book == null
      ? null
      : (books.includes(session.book) ? session.book : books[0]);
    CURRENT.chapter = Number.isFinite(session.chapter) ? session.chapter : null;
    CURRENT.mode = ["sequential", "random", "wrong", "favorite", "unattempted"].includes(session.mode)
      ? session.mode
      : (CURRENT.book == null ? "random" : "sequential");
    CURRENT.instantGrade = !!session.instantGrade;
    CURRENT.limit = parseInt(session.limit, 10) || CURRENT.limit;
    CURRENT.answers = session.answers && typeof session.answers === "object" ? session.answers : {};
    if (Array.isArray(session.questionIds) && session.questionIds.length) {
      const byId = new Map(ALL_QUESTIONS.map(q => [q.id, q]));
      CURRENT.questions = session.questionIds.map(id => byId.get(id)).filter(Boolean);
    }
    if (!CURRENT.questions.length) CURRENT.questions = buildQuestionList();
    CURRENT.idx = Math.min(Math.max(parseInt(session.idx, 10) || 0, 0), CURRENT.questions.length);
    return true;
  } finally {
    RESTORING_SESSION = false;
  }
}

function resetAiPanel() {
  // 切题/换章节/换模式时:只清空旧的输出(避免把 Q1 的讲解混到 Q2),
  // 保留面板的展开状态——ai-context 会随模板自动刷新到新题的题源/状态。
  CURRENT.aiOutput = "";
  // 切到新题:清掉旧题的 flash 标志,让新题"从已答 → 再答"时还能闪一次
  LAST_FLASHED_QID = null;
}

function addWrong(qid) { STATE.wrong[qid] = Date.now(); persist(); }
function removeWrong(qid) { delete STATE.wrong[qid]; persist(); }

  else STATE.favorite[qid] = Date.now();

// 刷新题库 = 全部进度归零(错题 + 已答 + 正确率),收藏保留
function resetProgress() {
  const wrongN = Object.keys(STATE.wrong).length;
  const answeredN = Object.keys(STATE.attempted).length;
  if (wrongN === 0 && answeredN === 0) { toast("还没有答题记录,无需刷新"); return; }
  if (!confirm(`确定要刷新题库(进度归零)吗?\n\n· 错题集:将清空 ${wrongN} 题\n· 已答记录:将清空 ${answeredN} 题(已答过的不再出现于「未做」模式)\n· 正确率:将归零为 —\n· 当前题面会回到第 1 题,已勾选的选项清空\n· 收藏不受影响`)) return;
  STATE.wrong = {};
  STATE.attempted = {};
  STATE.stats = { answered: 0, correct: 0 };
  persist();
  // 本轮题面与已选项也一起回到第 1 题
  CURRENT.idx = 0;
  CURRENT.answers = {};
  resetAiPanel();
  // 如果当前在"错题 / 未做"模式,题单语义会变(错题被清,未做变成全部),→ 切到"顺序"模式避免空屏/误判
  if (CURRENT.mode === "wrong" || CURRENT.mode === "unattempted") setMode("sequential");
  else render();
  saveSession();
  toast(`已刷新题库 · 错题 ${wrongN} / 已答 ${answeredN} 已清空`);
}
